# SGLang-FL Dispatch Configuration for Hygon DCU (DTK / HIP).
# NOT auto-loaded: get_platform_name() reports "nvidia" on DCU (DTK torch is
# plain HIP torch with a working torch.cuda, and SGLANG_FL_PLATFORM is only
# consulted after the torch probes). Loaded instead via SGLANG_FL_CONFIG,
# exported by .github/scripts/hygon/check.sh for the non-unit CI jobs — a
# preset config file outranks the SGLANG_FL_* env vars in PolicyManager, so
# it must stay out of the unit job (env-policy tests).
# Auto-loading for real would need the detection fix flagged to the dispatch
# owners in the PR description; this file mirrors vllm-plugin-FL's
# dispatch/config/hygon.yaml.

prefer: flagos

# FlagGems tag: v5.3.0 (rebuilt in the CI image for repo-baseline alignment).
#
# pow_* family + cat: the validated vLLM-on-DCU recipe (wrong numerics /
# FlagGems triton issue on DCU).
# cumsum, cumsum_out: FlagGems' wrapper computes K = numel // M // N and
# ZeroDivisionErrors on the EMPTY extend_seq_lens[:-1] slice a single-request
# prefill produces (e2e serving qwen3/4b_tp2, 2026-08-20); torch.cumsum is
# fine — the CI image casts the lens tensors to int64 where the HIP kernel
# needs it.
# scaled_dot_product_attention + flash_attention_forward: FlagGems' _hygon
# flash_api autotunes a triton config per shape; the server-warmup prefill
# shape hits a DTK triton make_ttgir PassManager::run failure (compile abort,
# 2026-08-24). On torch 2.10 sglang's torch_native attention dispatches
# through the aten-level flash_attention_forward patch, so BOTH names must
# be excluded for the fallback to aten SDPA (HIP) to take effect.
# count_nonzero: FlagGems' dim_compress permutes with a mismatched dim order
# on the 3-D tensor sglang's eplb expert_location._init_raw feeds it
# (qwen3_6 35b_a3b init, 2026-08-24); torch.count_nonzero handles it fine.
# Override per-run with env SGLANG_FL_FLAGOS_BLACKLIST if needed.
flagos_blacklist:
  - pow_scalar
  - pow_tensor_scalar
  - pow_tensor_tensor
  - pow_tensor_scalar_
  - pow_tensor_tensor_
  - cat
  - cumsum
  - cumsum_out
  - scaled_dot_product_attention
  - flash_attention_forward
  - count_nonzero
