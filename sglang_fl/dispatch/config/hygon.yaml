# Hygon BW1000 empty runtime: FlagTree 0.6.1+hcu3.6 / FlagGems 5.4.0.dev0.
# Baseline operator choices from the Hygon iteration-1 usage document.
prefer: flagos
deny_vendors:
  - cuda
flagos_blacklist:
  - count_nonzero
  - cumsum
  - layer_norm
  # Qwen3.6-VL's text-only path keeps an empty multimodal placeholder and
  # writes it with masked_scatter_. FlagGems 5.4.0 tries to broadcast the
  # zero-length mask to a non-empty dimension and raises in expand; native
  # vendor Torch treats the empty write as the required no-op.
  - masked_scatter_
op_backends:
  silu_and_mul: [flagos]
  mrotary_embedding: [flagos]
  topk: [reference]
  gemma_rms_norm: [reference]
  fused_moe: [vendor]
  chunk_gated_delta_rule: [vendor]
  fused_recurrent_gated_delta_rule: [vendor]
  fused_recurrent_gated_delta_rule_packed_decode: [vendor]
