# SGLang-FL Dispatch Configuration for Ascend NPU
prefer: flagos

# Qwen3.6 policy validated for the SGLang 0.5.18 / CANN 8.5 runtime. Native
# SGLang NPU implementations are exposed through the vendor adapters for the
# version-sensitive routing, norm, and MoE contracts. Qwen3.6 decode uses the
# native fused-sigmoid update. The generic fused-recurrent function is left on
# SGLang's native path because FlagGems v5.3.0 exposes a different inplace KxV
# state contract and cannot safely implement SGLang v0.5.18's VxK API.
op_backends:
  silu_and_mul: [flagos, vendor, reference]
  mrotary_embedding: [flagos, vendor, reference]
  topk: [vendor, flagos, reference]
  gemma_rms_norm: [vendor, flagos, reference]
  fused_moe: [vendor, flagos, reference]
  chunk_gated_delta_rule: [vendor, flagos, reference]

# FlagGems tag: v5.3.0 (see docker/ascend/empty-0.5.18.containerfile)
#
# ADDITIVE over the #55 baseline (origin/main flagos_blacklist): every op main
# blacklists is kept; we only ADD on top. Nothing is removed relative to main.
#   addmm  : F.linear with bias decomposes to aten.addmm even when "linear" is
#            blacklisted. FlagGems v5.3.0's Ascend addmm kernel masks only K, not
#            the M/N tail tiles; Qwen3-VL vision projection therefore triggers an
#            AICore MTE DDR out-of-range fault during autotuning. Route addmm to
#            torch_npu until the upstream kernel adds complete boundary masks.
#   masked_scatter_: Qwen3.6-VL writes deep-stack vision embeddings with
#            masked_scatter_. FlagGems v5.3.0 first reduces the expanded boolean
#            mask with its Triton sum kernel; CANN 8.5 rejects that launch with
#            coreDim=0 on every TP rank. Keep this one composite op on torch_npu;
#            do not blacklist sum globally because validated text kernels use it.
# conv1d was already in main's list (it stays); it is needed because the flag_gems
# triton conv1d/conv2d autotuner crashes (aicore exception) on Qwen3.6-35B-A3B
# causal_conv1d shapes.
flagos_blacklist:
  - full_like
  - index_copy_
  - gather
  - count_nonzero
  - index_put_
  - _index_put_impl_
  - cumsum
  - fill_scalar_
  - argmax
  - index
  - add_
  - conv1d
  - floor_divide
  - true_divide_
  - addmm
  - masked_scatter_

# OOT dispatch blacklist (SGLang op class names, not ATen op names): none by
# default. Keep MRotaryEmbedding enabled so the 0.5.18 acceptance matrix tests
# the configured FlagGems-first path together with attention_backend="ascend".
# Any rollback discovered during 910C validation must be recorded as an explicit
# policy change rather than silently skipped here. When this key is absent the
# plugin defaults to oot_blacklist = [].
