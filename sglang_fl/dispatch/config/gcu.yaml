# SGLang-FL Dispatch Configuration for GCU platform
prefer: vendor

# Keep in sync with SGLANG_FL_FLAGOS_BLACKLIST in launch scripts.
flagos_blacklist:
  - isin
  - clone
  - masked_scatter_
  - index_put_
  - _index_put_impl_
  - repeat_interleave_self_int
  - _unique2
  - pow_scalar
  - embedding
  - zero_

op_backends:
  mrotary_embedding: [reference]
