# SGLang-FL Dispatch Configuration for Enflame GCU (torch_gcu).
# Loaded via SGLANG_FL_CONFIG (highest-priority env override) — importing
# sglang.srt flips torch.cuda.is_available() to True on GCU, which would
# otherwise make the auto-detection load nvidia.yaml (see
# .github/scripts/enflame/setup.sh and tests/platforms/enflame.yaml).

prefer: flagos

strict: false

# Per-operator backend execution order (Optional).
# Attention runs through torch_gcu's SDPA/vendor kernels first; FlagGems'
# triton scaled_dot_product_attention fallback is not GCU-tuned, so it stays
# behind the vendor path (mirrors vllm_fl/dispatch/config/enflame.yaml).
op_backends:
  attention_backend:
    - vendor:gcu
    - flagos
    - reference
  rms_norm:
    - flagos
    - vendor:gcu
    - reference
  silu_and_mul:
    - flagos
    - vendor:gcu
    - reference
  rotary_embedding:
    - flagos
    - vendor:gcu
    - reference

# FlagOS operator blacklist.
# scaled_dot_product_attention: FlagGems triton SDPA misbehaves on GCU —
# let torch_gcu's native SDPA handle it (same entry as vllm-fl's enflame
# config).
# cumsum / count_nonzero: the GCU backend's wrappers divide by a head-count
# term that can be 0 (ZeroDivisionError during position computation /
# sampling) — identical failure signature to T-Head PPU (see the thead
# platform's SGLANG_FL_FLAGOS_BLACKLIST note). Blacklisting falls those ops
# back to torch native.
flagos_blacklist:
  - scaled_dot_product_attention
  - cumsum
  - cumsum_out
  - count_nonzero
  - unique
  - _unique2
