# SGLang-FL Dispatch Configuration for Enflame GCU (torch_gcu).
# Auto-loaded when torch.gcu.is_available() (see dispatch/config/utils.py).

prefer: flagos

strict: false

# Per-operator backend execution order (Optional).
# Attention runs through torch_gcu's SDPA/vendor kernels first; FlagGems'
# triton scaled_dot_product_attention fallback is not GCU-tuned, so it stays
# behind the vendor path (mirrors vllm_fl/dispatch/config/enflame.yaml).
op_backends:
  attention_backend:
    - vendor:gcu
    - flagos
    - reference
  rms_norm:
    - flagos
    - vendor:gcu
    - reference
  silu_and_mul:
    - flagos
    - vendor:gcu
    - reference
  rotary_embedding:
    - flagos
    - vendor:gcu
    - reference

# FlagOS operator blacklist.
# scaled_dot_product_attention: FlagGems triton SDPA misbehaves on GCU —
# let torch_gcu's native SDPA handle it (same entry as vllm-fl's enflame
# config).
flagos_blacklist:
  - scaled_dot_product_attention
