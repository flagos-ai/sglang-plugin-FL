# SGLang-FL Dispatch Configuration for tsingmicro (TXDA) platform
prefer: flagos

# Per-operator backend selection order.
# Tokens: vendor (platform-native), flagos (FlagGems/Triton), reference (pure PyTorch)
# Each op tries candidates left-to-right; falls to the next on failure.
op_backends:
  silu_and_mul:
    - reference
    - vendor       # vendor.tsingmicro – pure PyTorch, safe on TXDA hardware
    - flagos       # default.flagos – Triton kernel, may not be TXDA-verified

  # GemmaRMSNorm has no flagos registration, so it never reaches default.flagos;
  # vendor.tsingmicro drives the FlagGems _tsingmicro RMSNorm kernels with a
  # precomputed fp32 (1 + weight) and is preferred over the pure-PyTorch path.
  gemma_rms_norm:
    - vendor       # vendor.tsingmicro – FlagGems _tsingmicro RMSNorm kernels
    - reference    # reference.torch – pure PyTorch, fp32 weight+1
