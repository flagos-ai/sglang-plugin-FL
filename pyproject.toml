[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sglang_fl"
version = "0.1.0"
description = "SGLang OOT Plugin — FlagGems-based multi-chip adaptation"
requires-python = ">=3.10"
dependencies = [
    "flag_gems",
    "pyyaml",
]

[project.optional-dependencies]
cuda = ["sglang==0.5.18"]
# The Hygon two-wheel CI image installs this wheel together with the
# flagos-built SGLang wheel; the extra states the application contract the
# image resolver must satisfy. Runtime-owned distributions (torch, numpy,
# flagtree, flagcx) are frozen by the image's dynamic runtime constraints
# and are deliberately not restated here; SGLang closure dependencies
# (xgrammar, compressed-tensors, loguru, transformers,
# apache-tvm-ffi, ...) arrive through the SGLang wheel's own requirements
# and must not be duplicated in the plugin extra.
hygon = [
    # The derived HCU SGLang wheel: the exact published flagos wheel with
    # the reviewed HCU gating patch folded in BEFORE image assembly (see
    # tools/wheels/hygon/derive_sglang_wheel.py), so the product image
    # installs a normal wheel and never patches site-packages.
    "sglang==0.5.18+flagos.hcu1",
    # Compatibility assertion only: the operations Runtime supplies this
    # distribution (flag-gems==5.4.0); restating the exact line keeps a
    # resolver run against different indexes from selecting another build
    # whose libentry contract mismatches the Runtime's FlagTree Triton.
    "flag-gems==5.4.0",
    # Product compatibility pin requested by the Runtime owner. SGLang's
    # closure reaches datasets, while this Runtime supplies fsspec 2026.9.0;
    # datasets==5.2.0 is the first tested release without the older fsspec
    # upper bound. Keeping the pin in the selected platform extra makes it
    # part of the wheel contract instead of a hidden Docker requirement.
    "datasets==5.2.0",
    # Triton is intentionally absent here. The Hygon Runtime provides the
    # compiler as the /opt/flagtree module tree (Triton 3.6.0, selected by
    # the image-level PYTHONPATH), not as a pip distribution; its FlagGems
    # 5.4.0 build targets that launcher path. The image build therefore
    # excludes the ``triton`` distribution from resolution entirely (see
    # docker/hygon/runtime-0.5.18.excludes.txt); xgrammar still declares
    # it in its metadata, which pip check reports as the documented
    # platform capability exception (docker/hygon/scripts/ checks).
]

[project.entry-points."sglang.srt.platforms"]
sglang_fl = "sglang_fl:activate_platform"

[project.entry-points."sglang.srt.plugins"]
sglang_fl = "sglang_fl:load_plugin"

[tool.setuptools.packages.find]
include = ["sglang_fl*"]

[tool.setuptools.package-data]
"sglang_fl.dispatch.config" = ["*.yaml"]

[tool.ruff]
# Folders excluded from lint + format. These hold pre-existing issues that are
# out of scope for turning the lint gate back on (third-party vendor SDK code,
# example scripts, test suite). Everything else -- the sglang_fl core -- is
# scanned normally and must stay clean, so `continue-on-error` can be dropped.
extend-exclude = [
    "examples",
    "tests",
    "sglang_fl",
]

[tool.ruff.lint]
# E731: do not assign a lambda -- aligned with .pre-commit-config.yaml
# (ruff-check --ignore=E731).
ignore = ["E731"]
