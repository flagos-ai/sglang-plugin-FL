[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sglang_fl"
version = "0.1.0"
description = "SGLang OOT Plugin — FlagGems-based multi-chip adaptation"
requires-python = ">=3.10"
dependencies = [
    "flag_gems",
    "pyyaml",
]

[project.optional-dependencies]
cuda = ["sglang==0.5.18"]
nvidia = [
    "sglang==0.5.18",
    # The operations Runtime owns NumPy 1.26.4.  Leaving this unconstrained
    # lets current SciPy/Pandas metadata move it to NumPy 2 during an otherwise
    # ordinary SGLang install.
    "numpy==1.26.4",
    # SGLang -> humming-kernels[cu13] asks for an unversioned nvcc.  Select the
    # toolkit line already declared by the Runtime's torch 2.13.0+cu130 wheel;
    # the cuda-toolkit extra owns the exact nvcc/nvvm/crt sub-package pins.
    "cuda-toolkit[nvcc]==13.0.3",
    # Used by the plugin to locate the wheel-provided compiler and headers.
    # Declare it directly instead of relying on CUDA packages to provide it
    # transitively.
    "cuda-pathfinder>=1.8,<2",
    # Compatibility assertion only: the Runtime supplies this distribution.
    "flag-gems==5.4.0",
]

[project.entry-points."sglang.srt.platforms"]
sglang_fl = "sglang_fl:activate_platform"

[project.entry-points."sglang.srt.plugins"]
sglang_fl = "sglang_fl:load_plugin"

[tool.setuptools.packages.find]
include = ["sglang_fl*"]

[tool.setuptools.package-data]
"sglang_fl.dispatch.config" = ["*.yaml"]

[tool.ruff]
# Folders excluded from lint + format. These hold pre-existing issues that are
# out of scope for turning the lint gate back on (third-party vendor SDK code,
# example scripts, test suite). Everything else -- the sglang_fl core -- is
# scanned normally and must stay clean, so `continue-on-error` can be dropped.
extend-exclude = [
    "examples",
    "tests",
    "sglang_fl",
]

[tool.ruff.lint]
# E731: do not assign a lambda -- aligned with .pre-commit-config.yaml
# (ruff-check --ignore=E731).
ignore = ["E731"]
