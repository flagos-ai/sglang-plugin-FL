# Temporary Harbor push probe; this PR is not intended for merge.
name: Runtime CI image build
on:
  pull_request:
    paths: [.github/workflows/runtime-image-build.yml]

permissions:
  contents: read

jobs:
  harbor-push-probe:
    runs-on: flagcicd-810e
    timeout-minutes: 10
    steps:
      - name: Pull, tag, and push a minimal image
        env:
          SOURCE_IMAGE: ubuntu:24.04
          TARGET_IMAGE: harbor.baai.ac.cn/flagos-dev/sglang-plugin-fl:push-probe-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker image rm -f "$TARGET_IMAGE" "$SOURCE_IMAGE" >/dev/null 2>&1 || true' EXIT
          docker pull "$SOURCE_IMAGE"
          docker tag "$SOURCE_IMAGE" "$TARGET_IMAGE"
          docker push "$TARGET_IMAGE"
          docker buildx imagetools inspect "$TARGET_IMAGE"
