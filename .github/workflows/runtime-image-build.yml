# Temporary runtime image build workflow; this PR is not intended for merge.
name: Runtime CI image build
on:
  push:
    branches: [ci/runtime-build-probe]

permissions:
  contents: read

jobs:
  build-kunlunxin:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out Kunlunxin image source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: lentil1016/sglang-plugin-FL
          ref: e57e470705504ee3c8a6000c3603b16144db3d6c
          fetch-depth: 1

      - name: Log in to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HARBOR_USERNAME"
          test -n "$HARBOR_PASSWORD"
          printf '%s' "$HARBOR_PASSWORD" | docker login harbor.baai.ac.cn \
            --username "$HARBOR_USERNAME" --password-stdin

      - name: Build and push layered Kunlunxin CI image
        env:
          IMAGE: harbor.baai.ac.cn/flagos-dev/sglang-plugin-fl:0.5.18-kunlunxin-runtime-ci-20261109
        shell: bash
        run: |
          set -euo pipefail
          df -h .
          docker buildx use default
          docker buildx inspect default --bootstrap
          docker buildx build \
            --builder default \
            --file docker/kunlunxin/ci-runtime-0.5.18.containerfile \
            --target ci \
            --tag "$IMAGE" \
            --cache-from "type=registry,ref=$IMAGE" \
            --cache-to type=inline \
            --push \
            --provenance=false \
            --metadata-file build-metadata.json \
            .
          python3 - <<'PY'
          import json
          metadata = json.load(open('build-metadata.json'))
          print('image digest:', metadata.get('containerimage.digest'))
          PY
          docker buildx imagetools inspect "$IMAGE"

      - name: Log out of Harbor
        if: always()
        run: docker logout harbor.baai.ac.cn || true
