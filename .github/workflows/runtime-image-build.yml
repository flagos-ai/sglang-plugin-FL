# Temporary runtime image build workflow; this branch is not intended to merge.
name: Runtime CI image build
on:
  push:
    branches: [ci/runtime-build-probe]

permissions:
  contents: read

jobs:
  build-kunlunxin-flagtree-artifact:
    runs-on: ci-sglang-plugin-fl-kunlunxin
    timeout-minutes: 60
    steps:
      - name: Check out artifact definition
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Log in to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$HARBOR_PASSWORD" | docker login harbor.baai.ac.cn \
            --username "$HARBOR_USERNAME" --password-stdin

      - name: Extract and publish matched FlagTree compiler artifact
        env:
          SOURCE_IMAGE: harbor.baai.ac.cn/flagos-dev/sglang-plugin-fl@sha256:b0faa6a570501d8445aeb6fd78c5bbe58499b2573d5316a3d2902ed994f6245a
          ARTIFACT_IMAGE: harbor.baai.ac.cn/flagos-dev/sglang-plugin-fl:0.5.18-kunlunxin-flagtree-0.7.1a1-xpu3.6
        shell: bash
        run: |
          set -euo pipefail
          context=$(mktemp -d)
          cid=$(docker create "$SOURCE_IMAGE")
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true; rm -rf "$context"' EXIT

          docker cp "$cid:/opt/kunlun/venv/lib/python3.10/site-packages/flagtree" "$context/flagtree"
          docker cp "$cid:/opt/kunlun/venv/lib/python3.10/site-packages/flagtree-0.7.1a1+xpu3.6.dist-info" "$context/flagtree-0.7.1a1+xpu3.6.dist-info"
          docker cp "$cid:/opt/kunlun/venv/lib/python3.10/site-packages/triton" "$context/triton"
          mkdir -p "$context/bin"
          docker cp "$cid:/opt/kunlun/venv/bin/proton" "$context/bin/proton"
          docker cp "$cid:/opt/kunlun/venv/bin/proton-viewer" "$context/bin/proton-viewer"
          du -sh "$context"/*

          docker buildx build \
            --file .github/runtime-artifacts/kunlunxin-flagtree.containerfile \
            --tag "$ARTIFACT_IMAGE" \
            --push \
            --provenance=false \
            --metadata-file build-metadata.json \
            "$context"
          python3 -c "import json; print(json.load(open('build-metadata.json'))['containerimage.digest'])"
          docker buildx imagetools inspect "$ARTIFACT_IMAGE"

      - name: Log out of Harbor
        if: always()
        run: docker logout harbor.baai.ac.cn || true
