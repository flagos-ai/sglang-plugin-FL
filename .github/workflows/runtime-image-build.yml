# Temporary image build workflow; this PR is not intended for merge.
name: Runtime CI image build
on:
  pull_request:
    paths: [.github/workflows/runtime-image-build.yml]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: thead
            ref: ci/runtime-thead-0.5.18
            dockerfile: docker/thead/ci-runtime-0.5.18.containerfile
            image: harbor.baai.ac.cn/flagos-dev/sglang-plugin-fl:0.5.18-thead-runtime-ci-20261109
    runs-on: flagcicd-810e
    timeout-minutes: 240
    steps:
      - name: Check out image source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: lentil1016/sglang-plugin-FL
          ref: ${{ matrix.ref }}
          fetch-depth: 1

      - name: Build and push layered CI image
        env:
          PLATFORM: ${{ matrix.platform }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE: ${{ matrix.image }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx version
          # Use the engine-backed builder. The docker-container driver pulls its
          # BuildKit image from Docker Hub, which is not reachable on this runner.
          # Inline cache travels with the CI image and local failed-build layers
          # remain available in the persistent daemon between attempts.
          docker buildx use default
          docker buildx inspect default --bootstrap
          docker buildx build \
            --builder default \
            --file "$DOCKERFILE" \
            --target ci \
            --tag "$IMAGE" \
            --cache-from "type=registry,ref=$IMAGE" \
            --cache-to type=inline \
            --push \
            --provenance=false \
            --metadata-file build-metadata.json \
            .
          python3 - <<'PY'
          import json
          metadata = json.load(open('build-metadata.json'))
          print('image digest:', metadata.get('containerimage.digest'))
          PY
          docker buildx imagetools inspect "$IMAGE"
