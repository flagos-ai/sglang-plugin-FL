# Temporary runtime image build workflow; this branch is not intended to merge.
name: Runtime CI image build
on:
  push:
    branches: [ci/runtime-build-probe]

permissions:
  contents: read

jobs:
  build-kunlunxin-flagtree-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out artifact definition
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Extract digest-pinned FlagTree compiler overlay
        shell: bash
        run: |
          set -euo pipefail
          runtime_archive=/tmp/kunlunxin-runtime-flagtree.tar.gz
          source_archive=/tmp/kunlunxin-validated-flagtree.tar.gz
          context=/tmp/kunlunxin-flagtree-overlay
          mkdir -p "$context/site-packages" "$context/bin"

          python3 .github/scripts/extract_remote_archive_members.py \
            --registry-repository flagos-runtime/flagos-runtime-kunlunxin-xre5.37.1 \
            --blob-digest sha256:ceef0ba6a7389184724944acca0a8d3a8050d9e840140b5bb961cf2ccd69a4af \
            --size 3380282197 \
            --sha256 ceef0ba6a7389184724944acca0a8d3a8050d9e840140b5bb961cf2ccd69a4af \
            --workers 16 \
            --archive-output "$runtime_archive"
          runtime_record=$(tar -tzf "$runtime_archive" \
            | grep -E '^opt/flagtree/flagtree-0\.7\.0.*\.dist-info/RECORD$' \
            | tail -n 1)
          test -n "$runtime_record"
          tar -xOzf "$runtime_archive" "$runtime_record" > /tmp/runtime.RECORD
          rm -f "$runtime_archive"

          python3 .github/scripts/extract_remote_archive_members.py \
            --registry-repository flagos-dev/sglang-plugin-fl \
            --blob-digest sha256:7b9414d6aad715386635a5e475813a400332e3b41eeac8ac48ebedcac54e00f6 \
            --size 6912438598 \
            --sha256 7b9414d6aad715386635a5e475813a400332e3b41eeac8ac48ebedcac54e00f6 \
            --workers 16 \
            --archive-output "$source_archive"
          source_record=$(tar -tzf "$source_archive" \
            | grep -F 'opt/kunlun/venv/lib/python3.10/site-packages/flagtree-0.7.1a1+xpu3.6.dist-info/RECORD' \
            | tail -n 1)
          test -n "$source_record"
          tar -xOzf "$source_archive" "$source_record" > /tmp/source.RECORD

          python3 .github/runtime-artifacts/build_flagtree_overlay.py \
            --source-record /tmp/source.RECORD \
            --runtime-record /tmp/runtime.RECORD \
            --copy-list /tmp/copy-paths.txt \
            --remove-list "$context/remove-paths.txt"
          awk -F '\t' '$2 ~ /^site-packages\// {sub("^/", "", $1); print $1}' \
            /tmp/copy-paths.txt > /tmp/site-members.txt
          awk -F '\t' '$2 ~ /^bin\// {sub("^/", "", $1); print $1}' \
            /tmp/copy-paths.txt > /tmp/bin-members.txt
          tar -xzf "$source_archive" -C "$context/site-packages" \
            --strip-components=6 -T /tmp/site-members.txt
          tar -xzf "$source_archive" -C "$context/bin" \
            --strip-components=4 -T /tmp/bin-members.txt
          rm -f "$source_archive"

          du -sh "$context"/*
          df -h /tmp
          echo "ARTIFACT_CONTEXT=$context" >> "$GITHUB_ENV"

      - name: Log in to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$HARBOR_PASSWORD" | docker login harbor.baai.ac.cn \
            --username "$HARBOR_USERNAME" --password-stdin

      - name: Publish matched FlagTree compiler artifact
        env:
          ARTIFACT_IMAGE: harbor.baai.ac.cn/flagos-dev/sglang-plugin-fl:0.5.18-kunlunxin-flagtree-0.7.1a1-xpu3.6
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --file .github/runtime-artifacts/kunlunxin-flagtree.containerfile \
            --tag "$ARTIFACT_IMAGE" \
            --push \
            --provenance=false \
            --metadata-file /tmp/build-metadata.json \
            "$ARTIFACT_CONTEXT"
          python3 -c "import json; print(json.load(open('/tmp/build-metadata.json'))['containerimage.digest'])"
          docker buildx imagetools inspect "$ARTIFACT_IMAGE"

      - name: Log out of Harbor
        if: always()
        run: docker logout harbor.baai.ac.cn || true
