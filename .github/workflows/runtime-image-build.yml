# Temporary runtime image probe; this branch is not intended to merge.
name: Runtime CI image build
on:
  push:
    branches: [ci/runtime-build-probe]

permissions:
  contents: read

jobs:
  inventory-kunlunxin-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out probe branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Log in to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$HARBOR_PASSWORD" | docker login harbor.baai.ac.cn \
            --username "$HARBOR_USERNAME" --password-stdin

      - name: Inventory kunlunxin operations runtime image
        shell: bash
        run: |
          set -euo pipefail
          img='harbor.baai.ac.cn/flagos-runtime/flagos-runtime-kunlunxin-xre5.37.1@sha256:679182a04d187562a3e23bacb9d0eb876dabf09ac0c0a875c2b4a141b64cac69'
          docker pull "$img"
          cat > /tmp/inventory.sh <<'EOF'
          set +e
          PY="$(command -v python || command -v python3)"
          echo "=== python ==="
          "$PY" -V 2>&1
          command -v python python3 pip 2>&1
          echo "=== pip freeze ==="
          "$PY" -m pip freeze 2>/dev/null | sort
          echo "=== /opt ==="
          ls -la /opt 2>&1
          echo "=== /flagos ==="
          ls /flagos 2>&1
          echo "=== /flagos/bin ==="
          ls /flagos/bin 2>&1
          echo "=== /opt/flagtree (top 40) ==="
          ls /opt/flagtree 2>/dev/null | head -40
          echo "=== key imports ==="
          for m in torch triton flagtree sglang sgl_kernel flag_gems flagcx transformers pytest; do
            printf '%s: ' "$m"
            "$PY" -c "import $m; print(getattr($m, '__version__', 'n/a'), $m.__file__)" 2>&1 | tail -1
          done
          echo "=== XRE versions ==="
          cat /flagos/lib/python3.10/site-packages/torch_xmlir/_versions.txt 2>&1
          echo "=== relevant env ==="
          env | grep -iE '^(PYTHON|LD_LIBRARY|PATH|FLAG)' | sort
          EOF
          docker run --rm -i --entrypoint /bin/bash "$img" -s < /tmp/inventory.sh

      - name: Log out of Harbor
        if: always()
        run: docker logout harbor.baai.ac.cn || true
