# Reusable functional test workflow.
#
# Runs unit tests (pure-logic, no GPU required) followed by functional tests
# (component-level GPU tests: ops correctness, compilation, distributed) in
# a single job. Combining them avoids a second container startup and project
# install on the device runner (unit + functional merged, ported from
# vllm-plugin-FL #581).
name: Functional Test

on:
  workflow_call:
    inputs:
      platform:
        description: "Platform name (e.g., nvidia, ascend)"
        required: true
        type: string
      branch:
        description: "Branch/ref under test (empty = caller ref)"
        required: false
        type: string
        default: ""
      ci_image:
        description: "Docker image for the test container"
        required: true
        type: string
      runner_labels:
        description: "JSON array of runner labels"
        required: true
        type: string
      container_volumes:
        description: "JSON array of volume mounts"
        required: false
        type: string
        default: "[]"
      container_options:
        description: "Docker container options string"
        required: false
        type: string
        default: ""
      test_driver:
        description: "Platform test driver compatible with tests/run.py"
        required: false
        type: string
        default: "tests/run.py"
      test_artifact_path:
        description: "Additional platform-specific artifact path"
        required: false
        type: string
        default: ""
      test_artifact_required:
        description: "Fail when the platform-specific artifact path is empty"
        required: false
        type: boolean
        default: false
      timeout:
        description: "Timeout for the job in minutes"
        required: false
        type: number
        default: 15

jobs:
  functional-test:
    name: "Functional (${{ inputs.platform }})"
    runs-on: ${{ fromJson(inputs.runner_labels) }}
    timeout-minutes: ${{ inputs.timeout }}
    container:
      image: ${{ inputs.ci_image }}
      volumes: ${{ fromJson(inputs.container_volumes) }}
      options: ${{ inputs.container_options }}

    steps:
      - name: Checkout (attempt 1)
        id: checkout1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.branch }}
        continue-on-error: true
      - name: Checkout (attempt 2)
        id: checkout2
        if: steps.checkout1.outcome == 'failure'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.branch }}
        continue-on-error: true
      - name: Checkout (attempt 3)
        if: steps.checkout2.outcome == 'failure'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.branch }}

      # Temporary evidence-only probe. This intentionally fails after printing
      # both return codes so no project installation or model test follows.
      - name: Probe Runtime Torch backend autoload A/B
        if: inputs.platform == 'hygon'
        shell: bash
        run: |
          set +e
          python - <<'PY'
          from importlib import metadata

          print("Installed Torch backend entry points:", flush=True)
          for ep in metadata.entry_points(group="torch.backends"):
              dist = getattr(ep, "dist", None)
              name = dist.metadata.get("Name") if dist is not None else None
              owner = f"{name}=={dist.version}" if dist is not None else "unknown"
              print(f"  {ep.name} = {ep.value} ({owner})", flush=True)
          PY
          inventory_rc=$?

          echo '=== default/autoload-enabled import ==='
          env -u TORCH_DEVICE_BACKEND_AUTOLOAD python - <<'PY'
          import os
          import torch
          print("autoload env:", os.getenv("TORCH_DEVICE_BACKEND_AUTOLOAD"), flush=True)
          print("torch:", torch.__version__, flush=True)
          print("hcu:", getattr(torch, "__hcu_version__", None), flush=True)
          print("available:", torch.cuda.is_available(), flush=True)
          PY
          default_rc=$?

          echo '=== autoload-disabled import ==='
          TORCH_DEVICE_BACKEND_AUTOLOAD=0 python - <<'PY'
          import os
          import torch
          print("autoload env:", os.getenv("TORCH_DEVICE_BACKEND_AUTOLOAD"), flush=True)
          print("torch:", torch.__version__, flush=True)
          print("hcu:", getattr(torch, "__hcu_version__", None), flush=True)
          print("available:", torch.cuda.is_available(), flush=True)
          PY
          disabled_rc=$?

          printf 'RESULT inventory_rc=%s default_rc=%s disabled_rc=%s\n' \
            "$inventory_rc" "$default_rc" "$disabled_rc"
          exit 1

      - name: Check device availability
        run: bash .github/scripts/${{ inputs.platform }}/check.sh

      - name: Install project
        run: bash .github/scripts/${{ inputs.platform }}/setup.sh

      - name: Run Ascend compatibility probe
        if: inputs.platform == 'ascend'
        run: python3 examples/ascend_compat_probe.py

      - name: Run unit tests
        env:
          TEST_DRIVER: ${{ inputs.test_driver }}
        run: |
          if [ "${{ inputs.platform }}" = "hygon" ]; then
            unset CUDA_VISIBLE_DEVICES ROCR_VISIBLE_DEVICES
          fi
          python "$TEST_DRIVER" \
            --platform ${{ inputs.platform }} \
            --scope unit

      - name: Run Hygon vendor-stack verifier regressions
        if: inputs.platform == 'hygon'
        run: python .github/scripts/hygon/ci_environment.py -- python -m pytest .github/scripts/hygon/test_verify_environment.py -q --junitxml=test-results-hygon-environment.xml

      - name: Run functional tests
        env:
          TEST_DRIVER: ${{ inputs.test_driver }}
        run: |
          if [ "${{ inputs.platform }}" = "hygon" ]; then
            unset CUDA_VISIBLE_DEVICES ROCR_VISIBLE_DEVICES
          fi
          python "$TEST_DRIVER" \
            --platform ${{ inputs.platform }} \
            --scope functional

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: functional-${{ inputs.platform }}
          path: |
            test-results-${{ inputs.platform }}.xml
            test-results-${{ inputs.platform }}.json
            test-results-hygon-environment.xml
            ${{ inputs.test_artifact_path }}
          if-no-files-found: ${{ inputs.test_artifact_required && 'error' || 'warn' }}
