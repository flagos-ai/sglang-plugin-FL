# Reusable functional test workflow.
#
# Runs unit tests (pure-logic, no GPU required) followed by functional tests
# (component-level GPU tests: ops correctness, compilation, distributed) in
# a single job. Combining them avoids a second container startup and project
# install on the device runner (unit + functional merged, ported from
# vllm-plugin-FL #581).
name: Functional Test

on:
  workflow_call:
    inputs:
      platform:
        description: "Platform name (e.g., nvidia, ascend)"
        required: true
        type: string
      branch:
        description: "Branch/ref under test (empty = caller ref)"
        required: false
        type: string
        default: ""
      ci_image:
        description: "Docker image for the test container"
        required: true
        type: string
      runner_labels:
        description: "JSON array of runner labels"
        required: true
        type: string
      container_volumes:
        description: "JSON array of volume mounts"
        required: false
        type: string
        default: "[]"
      container_options:
        description: "Docker container options string"
        required: false
        type: string
        default: ""
      test_driver:
        description: "Platform test driver compatible with tests/run.py"
        required: false
        type: string
        default: "tests/run.py"
      test_artifact_path:
        description: "Additional platform-specific artifact path"
        required: false
        type: string
        default: ""
      test_artifact_required:
        description: "Fail when the platform-specific artifact path is empty"
        required: false
        type: boolean
        default: false
      timeout:
        description: "Timeout for the job in minutes"
        required: false
        type: number
        default: 15

jobs:
  functional-test:
    name: "Functional (${{ inputs.platform }})"
    runs-on: ${{ fromJson(inputs.runner_labels) }}
    timeout-minutes: ${{ inputs.timeout }}
    container:
      image: ${{ inputs.ci_image }}
      volumes: ${{ fromJson(inputs.container_volumes) }}
      options: ${{ inputs.container_options }}

    steps:
      - name: Checkout (attempt 1)
        id: checkout1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.branch }}
        continue-on-error: true
      - name: Checkout (attempt 2)
        id: checkout2
        if: steps.checkout1.outcome == 'failure'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.branch }}
        continue-on-error: true
      - name: Checkout (attempt 3)
        if: steps.checkout2.outcome == 'failure'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.branch }}

      - name: Check device availability
        run: bash .github/scripts/${{ inputs.platform }}/check.sh

      - name: Install project
        run: bash .github/scripts/${{ inputs.platform }}/setup.sh

      - name: Run Ascend compatibility probe
        if: inputs.platform == 'ascend'
        run: python3 examples/ascend_compat_probe.py

      - name: Run unit tests
        # Focused T-Head runtime-image acceptance runs the hardware functional
        # suite directly. The all-platform unit suite has an unrelated
        # cross-test sglang namespace-state leak under this minimal image.
        if: inputs.platform != 'thead'
        env:
          TEST_DRIVER: ${{ inputs.test_driver }}
        run: |
          if [ "${{ inputs.platform }}" = "hygon" ]; then
            unset CUDA_VISIBLE_DEVICES ROCR_VISIBLE_DEVICES
          fi
          python "$TEST_DRIVER" \
            --platform ${{ inputs.platform }} \
            --scope unit

      - name: Run Hygon vendor-stack verifier regressions
        if: inputs.platform == 'hygon'
        run: python .github/scripts/hygon/ci_environment.py -- python -m pytest .github/scripts/hygon/test_verify_environment.py -q --junitxml=test-results-hygon-environment.xml

      - name: Run functional tests
        env:
          TEST_DRIVER: ${{ inputs.test_driver }}
        run: |
          if [ "${{ inputs.platform }}" = "hygon" ]; then
            unset CUDA_VISIBLE_DEVICES ROCR_VISIBLE_DEVICES
          fi
          if [ "${{ inputs.platform }}" = "thead" ]; then
            # Focus the minimal-runtime acceptance on real PPU op execution.
            # Full SGLang startup is exercised by the following TP2 E2E job.
            python -m pytest tests/functional_tests/ops/test_ops_correctness.py \
              -v --tb=short -s
          else
            python "$TEST_DRIVER" \
              --platform ${{ inputs.platform }} \
              --scope functional
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: functional-${{ inputs.platform }}
          path: |
            test-results-${{ inputs.platform }}.xml
            test-results-${{ inputs.platform }}.json
            test-results-hygon-environment.xml
            ${{ inputs.test_artifact_path }}
          if-no-files-found: ${{ inputs.test_artifact_required && 'error' || 'warn' }}
