# Slash Command Dispatcher
#
# Parses PR comments for slash commands and dispatches them as
# repository_dispatch events to the corresponding handler workflows.
# Ported from vllm-plugin-FL #581.
#
# Supported commands:
#   /rerun   — Re-run failed CI jobs (PR author or write+)
#   /cancel  — Cancel in-progress CI runs (PR author or write+)
#   /nightly — Trigger nightly CI on this PR's branch (triage+)
#   /weekly  — Trigger weekly CI on this PR's branch (triage+)
#
# Uses peter-evans/slash-command-dispatch for parsing.
# Individual handler workflows perform their own permission checks.
name: Slash Command Dispatch

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  # repository_dispatch events require contents:write on the token that
  # creates them; read-only contents breaks every /rerun /cancel /nightly
  # /weekly command at the dispatch step.
  contents: write
  pull-requests: write
  issues: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: peter-evans/slash-command-dispatch@13bc09769d122a64f75aa5037256f6f2d78be8c4  # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          reaction-token: ${{ secrets.GITHUB_TOKEN }}
          commands: |
            rerun
            cancel
            nightly
            weekly
          permission: none
          issue-type: pull-request
          repository: ${{ github.repository }}
          dispatch-type: repository
