# TEMPORARY hardware evidence probe for the Hygon runtime CI image
# (PR #180 application-fixed image). DO NOT MERGE — this workflow exists only
# to run six machine checks on a real HCU runner via a draft PR; it is closed
# and deleted once the evidence is collected.
name: Hygon hardware evidence (temp)

on:
  pull_request:
    paths:
      - ".github/workflows/runtime-hygon-hw-evidence.yml"

permissions:
  contents: read

jobs:
  hw-evidence:
    name: "HCU evidence"
    runs-on: [ci-sglang-plugin-fl-hygon]
    timeout-minutes: 120
    container:
      image: harbor.baai.ac.cn/flagos-dev/sglang-plugin-fl@sha256:ccfb9f0954a0a685131428525ef6343c2e38baf766122e29e25865cf81a0695a
      volumes:
        - /opt/hyhal:/opt/hyhal
        - /usr/local/hyhal:/usr/local/hyhal
        - /data:/data
        - /data/models/Qwen:/models:ro
      options: >-
        --hostname sglang-plugin-fl
        --ipc=host
        --shm-size=64g
        --ulimit memlock=-1
        --ulimit stack=67108864
        --user root
        --init
        -e TORCH_DEVICE_BACKEND_AUTOLOAD=0
        -e SGLANG_CUDA_COREDUMP_BEFORE_CRASH_WAIT_SECS=0
        --device /dev/kfd
        --device /dev/mkfd
        --device /dev/dri
        --group-add video

    defaults:
      run:
        shell: bash

    steps:
      # No actions/* usage: action resolution on the self-hosted runner goes
      # through a proxy that is flaky today; every check below is inline.
      # Mirrors the core assertions of .github/scripts/hygon/check.sh
      # (device nodes + idle-GPU inventory) without the repo checkout.
      - name: Check device availability
        run: |
          set -euo pipefail
          test -e /dev/kfd
          test -e /dev/mkfd
          test -d /dev/dri
          test -d /opt/hyhal
          python - <<'PY'
          import torch
          n = torch.cuda.device_count()
          print("device_count:", n)
          assert n >= 1, "no HCU device visible"
          for i in range(n):
              free, total = torch.cuda.mem_get_info(i)
              print(f"  visible {i}: {free/total:.0%} free")
          PY

      - name: Environment and patch evidence
        run: |
          unset CUDA_VISIBLE_DEVICES ROCR_VISIBLE_DEVICES
          python - <<'PY'
          import importlib.metadata as md
          import os
          import sys

          print("PYTHONPATH:", os.environ.get("PYTHONPATH"))
          print("sys.path:", sys.path)

          # (a) no aiter distribution anywhere in the environment
          names = sorted({(d.metadata["Name"] or "").lower() for d in md.distributions()})
          aiter_like = [n for n in names if "aiter" in n]
          print("distributions total:", len(names))
          print("aiter-like distributions:", aiter_like)
          assert not aiter_like, f"aiter distributions present: {aiter_like}"

          # (b) real HCU torch build
          import torch
          assert hasattr(torch, "__hcu_version__"), \
              "torch.__hcu_version__ missing: not the HCU torch build"
          print("torch:", torch.__version__)
          print("torch.__hcu_version__:", torch.__hcu_version__)
          print("device_count:", torch.cuda.device_count())
          print("device 0:", torch.cuda.get_device_name(0))

          # (c) patched modules import without aiter and without sgl_kernel
          import sglang.srt.layers.quantization.quark.schemes.quark_w4a4_mxfp4
          import sglang.srt.layers.quantization.quark.schemes.quark_w4a4_mxfp4_moe
          import sglang.srt.layers.quantization.quark_int4fp8_moe
          import sglang.srt.layers.attention.triton_backend
          import sglang.srt.layers.activation
          import sglang.srt.layers.layernorm
          import sglang.srt.layers.sampler
          aiter_modules = sorted(m for m in sys.modules if "aiter" in m.lower())
          print("aiter-ish sys.modules entries:", aiter_modules)
          assert "aiter" not in sys.modules, "aiter leaked into sys.modules"
          print("quark modules imported aiter-free: OK")

          # (d) triton identity, full detail
          import triton
          print("triton.__version__:", triton.__version__)
          print("triton.__file__:", triton.__file__)
          print("triton.__path__:", list(triton.__path__))
          try:
              print("triton dist version (metadata):", md.version("triton"))
          except md.PackageNotFoundError:
              print("triton dist version (metadata): <no distribution>")

          # (e) every triton path must resolve under /opt/flagtree
          for p in [triton.__file__, *list(triton.__path__)]:
              real = os.path.realpath(p)
              print(f"triton path: {p} -> {real}")
              assert real.startswith("/opt/flagtree"), \
                  f"triton path outside /opt/flagtree: {p} -> {real}"
          print("all triton paths under /opt/flagtree: OK")
          PY

      - name: Reproduce CI attention_backend import with full traceback
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          pip install --no-deps --no-build-isolation -e . >/dev/null 2>&1 || pip install --no-deps -e .
          python - <<'PY'
          import traceback
          import importlib

          name = "sglang_fl.dispatch.backends.vendor.hygon.impl.attention_backend"
          try:
              importlib.import_module(name)
              print("IMPORT OK:", name)
          except BaseException:
              print("=" * 60)
              traceback.print_exc()
              exc = getattr(traceback.format_exc(), "__cause__", None)
              # walk the full chained causes
              import sys
              e = sys.exc_info()[1]
              depth = 0
              while e is not None and depth < 10:
                  print(f"--- cause chain level {depth}: {type(e).__name__}: {e}")
                  e = e.__cause__ or e.__context__
                  depth += 1
              print("=" * 60)
              raise SystemExit(1)
          PY

      - name: Representative BF16 triton compile on HCU
        run: |
          unset CUDA_VISIBLE_DEVICES ROCR_VISIBLE_DEVICES
          # @triton.jit needs inspect.getsource, so the kernel must live in a
          # real file — heredoc/stdin scripts fail with "should be defined in
          # a Python file".
          cat > /tmp/bf16_kernel_test.py <<'PY'
          import torch
          import triton
          import triton.language as tl

          @triton.jit
          def add_bf16_kernel(x_ptr, y_ptr, out_ptr, n, BLOCK: tl.constexpr):
              pid = tl.program_id(axis=0)
              offs = pid * BLOCK + tl.arange(0, BLOCK)
              mask = offs < n
              x = tl.load(x_ptr + offs, mask=mask)
              y = tl.load(y_ptr + offs, mask=mask)
              tl.store(out_ptr + offs, x + y, mask=mask)

          n = 8192
          x = torch.randn(n, device="cuda", dtype=torch.bfloat16)
          y = torch.randn(n, device="cuda", dtype=torch.bfloat16)
          out = torch.empty_like(x)
          grid = (triton.cdiv(n, 1024),)
          add_bf16_kernel[grid](x, y, out, n, BLOCK=1024)
          torch.cuda.synchronize()
          ref = x.float() + y.float()
          assert torch.allclose(out.float(), ref, atol=1e-2, rtol=1e-2), \
              f"BF16 kernel numerics wrong: max diff {(out.float()-ref).abs().max()}"
          print("BF16 triton kernel compiled + executed on HCU: OK")
          PY
          python /tmp/bf16_kernel_test.py
