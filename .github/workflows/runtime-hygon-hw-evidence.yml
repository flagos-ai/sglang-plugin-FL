# TEMPORARY hardware probe for the Hygon runtime CI image (PR #180).
# DO NOT MERGE — exists only to diagnose the functional-stage failures on a
# real HCU runner: (a) the flagtree triton HSACO "cannot find ROCm device
# library" compile error, (b) the mtp_attention 256-token numerical mismatch.
# Closed and deleted once the evidence is collected.
name: Hygon hardware evidence (temp)

on:
  pull_request:
    paths:
      - ".github/workflows/runtime-hygon-hw-evidence.yml"

permissions:
  contents: read

jobs:
  hw-evidence:
    name: "HCU evidence"
    runs-on: [ci-sglang-plugin-fl-hygon]
    timeout-minutes: 60
    container:
      image: harbor.baai.ac.cn/flagos-dev/sglang-plugin-fl@sha256:80c06190fccf12a5b84225e467def9ee46293bface24c5d1d5a7b3c6cf7d259a
      volumes:
        - /opt/hyhal:/opt/hyhal
        - /usr/local/hyhal:/usr/local/hyhal
        - /data:/data
        - /data/models/Qwen:/models:ro
      options: >-
        --hostname sglang-plugin-fl
        --ipc=host
        --shm-size=64g
        --ulimit memlock=-1
        --ulimit stack=67108864
        --user root
        --init
        -e TORCH_DEVICE_BACKEND_AUTOLOAD=0
        -e SGLANG_CUDA_COREDUMP_BEFORE_CRASH_WAIT_SECS=0
        --device /dev/kfd
        --device /dev/mkfd
        --device /dev/dri
        --group-add video

    defaults:
      run:
        shell: bash

    env:
      # Mirror the failing CI functional step: the platform yaml env_defaults
      # that tests/run.py injects around pytest.
      USE_FLAGGEMS: "1"
      USE_FLAGTUNE: "0"
      SGLANG_PLUGINS: sglang_fl
      FLAGCX_PATH: /sgl-workspace/FlagCX
      SGLANG_FL_DIST_BACKEND: flagcx
      SGLANG_PLATFORM: sglang_fl

    steps:
      - name: Check device availability
        run: |
          set -euo pipefail
          test -e /dev/kfd
          python - <<'PY'
          import torch
          n = torch.cuda.device_count()
          print("device_count:", n)
          assert n >= 1, "no HCU device visible"
          for i in range(n):
              free, total = torch.cuda.mem_get_info(i)
              print(f"  visible {i}: {free/total:.0%} free")
          print("device 0:", torch.cuda.get_device_name(0))
          PY

      - name: Environment identity
        run: |
          set -euo pipefail
          env | sort | grep -iE "FLAG|SGLANG|TRITON|ROCM|HIP|HSA" || true
          echo "--- triton identity ---"
          python - <<'PY'
          import triton
          print("triton:", triton.__version__, triton.__file__)
          PY

      # No actions/checkout (resolution on this runner pool is flaky); fetch
      # the PR head tarball directly. df87350 = the head the failing CI run
      # 43390763647 executed (same tests, same image digest).
      - name: Fetch repo head and install plugin
        run: |
          set -euo pipefail
          work="/__w/sglang-plugin-FL/sglang-plugin-FL"
          rm -rf "$work" && mkdir -p "$work"
          curl -fL --retry 5 --retry-delay 10 \
            "https://codeload.github.com/lentil1016/sglang-plugin-FL/tar.gz/df87350c2916a27b348edbc1d48f5fea01628a69" \
            -o /tmp/plugin.tar.gz
          tar -xzf /tmp/plugin.tar.gz --strip-components=1 -C "$work"
          cd "$work"
          pip install --no-deps --no-build-isolation -e . >/dev/null
          pip install -q pytest==9.1.1 pytest-timeout==2.4.0
          echo "repo ready at $work"

      # Reproduce the HSACO failure with a clang wrapper that logs the exact
      # argv flagtree passes (plus copies of the tempfile inputs) so the
      # failing command can be replayed verbatim afterwards.
      - name: Failing op with argv-logging clang wrapper
        run: |
          set -euo pipefail
          cat > /tmp/clangwrap <<'EOF'
          #!/bin/bash
          REAL=/opt/dtk/aillvm/bin/clang-18
          mkdir -p /tmp/clang-inputs
          n=$(($(cat /tmp/clang-seq 2>/dev/null || echo 0)+1)); echo "$n" > /tmp/clang-seq
          { printf 'CMD %d ARGS:' "$n"; printf ' %q' "$@"; echo; } >> /tmp/clang-cmds.log
          for a in "$@"; do
            case "$a" in
              /tmp/*.ll|/tmp/*.s|/tmp/*.amdgcn)
                cp -f "$a" "/tmp/clang-inputs/$n-$(basename "$a")" 2>/dev/null || true ;;
            esac
          done
          out=$("$REAL" "$@" 2>&1); rc=$?
          echo "RC $n = $rc" >> /tmp/clang-cmds.log
          if [ "$rc" -ne 0 ]; then { echo "=== cmd $n ==="; echo "$out"; } >> /tmp/clang-stderr.log; fi
          exit "$rc"
          EOF
          chmod +x /tmp/clangwrap
          rm -f /tmp/clang-cmds.log /tmp/clang-stderr.log /tmp/clang-seq
          export TRITON_HIP_CLANG_PATH=/tmp/clangwrap
          cd /__w/sglang-plugin-FL/sglang-plugin-FL
          pytest 'tests/functional_tests/ops/test_hygon_mtp_logprobs.py::test_hcu_padding_equivalence_for_real_index_kernels[dtype0-1]' \
            --timeout=300 -q > /tmp/pytest-baseline.log 2>&1 || echo "pytest rc=$? (expected failure)"
          tail -20 /tmp/pytest-baseline.log
          echo "=== captured stderr of failing clang invocations ==="
          cat /tmp/clang-stderr.log 2>/dev/null | head -20 || echo "(none captured)"

      # Replay the first failing clang command four ways to isolate exactly
      # which missing piece the image needs.
      - name: Replay failing clang command in four variants
        run: |
          set -uo pipefail
          python - <<'PY'
          import os
          import re
          import shlex
          import subprocess

          lines = open("/tmp/clang-cmds.log").read().splitlines()
          cmds, rcs = {}, {}
          for ln in lines:
              m = re.match(r"CMD (\d+) ARGS: (.*)", ln)
              if m:
                  cmds[int(m.group(1))] = shlex.split(m.group(2))
                  continue
              m = re.match(r"RC (\d+) = (-?\d+)", ln)
              if m:
                  rcs[int(m.group(1))] = int(m.group(2))
          failing = sorted(n for n in cmds if rcs.get(n, 0) != 0)
          assert failing, "no failing clang invocation captured: " + str(rcs)
          n = failing[0]
          args = cmds[n]
          for i, a in enumerate(args):
              if a.startswith("/tmp/") and a.endswith((".ll", ".s", ".amdgcn")):
                  saved = f"/tmp/clang-inputs/{n}-{os.path.basename(a)}"
                  if os.path.exists(saved):
                      args[i] = saved
          args[0] = "/opt/dtk/aillvm/bin/clang-18"
          print(f"failing cmd [{n}]:", " ".join(args))
          print("input exists:", {a: os.path.exists(a) for a in args if a.startswith("/tmp/")})

          def run(tag, extra, env_extra=None):
              env = dict(os.environ)
              env.update(env_extra or {})
              r = subprocess.run(args + extra, capture_output=True, text=True, env=env)
              err = (r.stderr or r.stdout).strip()[:300]
              print(f"[{tag}] rc={r.returncode} :: {err}")

          run("a-verbatim", [])
          run("b-device-lib-flag", ["--rocm-device-lib-path=/opt/dtk/amdgcn/bitcode"])
          run("c-rocm-path-flag", ["--rocm-path=/opt/dtk"])
          run("d-rocm-path-env", [], {"ROCM_PATH": "/opt/dtk"})
          PY

      # Decisive check 1: the same failing test with a clang wrapper that
      # injects --rocm-device-lib-path into every flagtree invocation.
      - name: Same test under fix candidate (device-lib injection)
        run: |
          set -euo pipefail
          cat > /tmp/clangfix <<'EOF'
          #!/bin/bash
          REAL=/opt/dtk/aillvm/bin/clang-18
          FIX="--rocm-device-lib-path=/opt/dtk/amdgcn/bitcode"
          for a in "$@"; do
            if [ "$a" = "$FIX" ]; then
              exec "$REAL" "$@"
            fi
          done
          exec "$REAL" "$@" "$FIX"
          EOF
          chmod +x /tmp/clangfix
          export TRITON_HIP_CLANG_PATH=/tmp/clangfix
          cd /__w/sglang-plugin-FL/sglang-plugin-FL
          pytest 'tests/functional_tests/ops/test_hygon_mtp_logprobs.py::test_hcu_padding_equivalence_for_real_index_kernels[dtype0-1]' \
            --timeout=300 -q > /tmp/pytest-fix.log 2>&1 && echo "FIX-CANDIDATE(device-lib): PASS" || echo "FIX-CANDIDATE(device-lib): FAIL rc=$?"
          tail -8 /tmp/pytest-fix.log

      # Decisive check 2: plain clang-18 + only the vendor env.sh ROCM_PATH —
      # the cheapest possible image fix if it works.
      - name: Same test under ROCM_PATH env only
        run: |
          set -euo pipefail
          unset TRITON_HIP_CLANG_PATH
          export ROCM_PATH=/opt/dtk
          cd /__w/sglang-plugin-FL/sglang-plugin-FL
          pytest 'tests/functional_tests/ops/test_hygon_mtp_logprobs.py::test_hcu_padding_equivalence_for_real_index_kernels[dtype0-1]' \
            --timeout=300 -q > /tmp/pytest-rocmenv.log 2>&1 && echo "FIX-CANDIDATE(ROCM_PATH env): PASS" || echo "FIX-CANDIDATE(ROCM_PATH env): FAIL rc=$?"
          tail -8 /tmp/pytest-rocmenv.log

      # Second failure class: the 256-token attention mismatch, full detail.
      - name: Attention numerics full detail
        run: |
          set -uo pipefail
          export TRITON_HIP_CLANG_PATH=/tmp/clangfix
          cd /__w/sglang-plugin-FL/sglang-plugin-FL
          pytest 'tests/functional_tests/ops/test_hygon_mtp_attention.py::test_target_verify_chain_matches_dense_reference' \
            -k "256" --timeout=600 -q -l > /tmp/pytest-attn.log 2>&1 && echo "ATTN-256: PASS" || echo "ATTN-256: FAIL rc=$?"
          tail -40 /tmp/pytest-attn.log
