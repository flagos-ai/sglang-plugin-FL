# Handler for /nightly slash command.
# Triggers the nightly CI workflow on the PR's head branch.
# Ported from vllm-plugin-FL #581.
#
# Usage:
#   /nightly              — test all platforms on this PR's branch
#   /nightly enflame      — test only the enflame platform
#   /nightly enflame main — test only enflame on main branch
#
# Authorized users: collaborators with triage/write/maintain/admin.
name: PR /nightly Command

on:
  repository_dispatch:
    types: [nightly-command]

permissions:
  actions: write
  contents: read
  pull-requests: write

jobs:
  trigger-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check commenter authorization
        id: auth
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENTER: ${{ github.event.client_payload.github.actor }}
        run: |
          set -euo pipefail
          perm=$(gh api "repos/${{ github.repository }}/collaborators/$COMMENTER/permission" \
            --jq '.permission' 2>/dev/null || echo "none")
          if echo "$perm" | grep -qE '^(admin|write|maintain|triage)$'; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::$COMMENTER is not authorized (need triage or higher)"
          exit 1

      - name: Parse command arguments
        id: parse
        env:
          GH_TOKEN: ${{ github.token }}
          COMMAND_ARGS: ${{ github.event.client_payload.slash_command.args.unnamed.arg1 }}
          BRANCH_ARG: ${{ github.event.client_payload.slash_command.args.unnamed.arg2 }}
          PR_URL: ${{ github.event.client_payload.pull_request.url }}
        run: |
          set -euo pipefail
          platforms="${COMMAND_ARGS:-}"
          branch="${BRANCH_ARG:-}"
          head_json=$(gh api "$PR_URL")
          if [ -z "$branch" ]; then
            # Fork PRs keep their head branch in the fork, not this repo —
            # dispatching on that ref name would fail (or worse, pick an
            # unrelated same-named branch here). Require an explicit branch
            # for fork PRs.
            if [ "$(printf '%s' "$head_json" | jq -r '.head.repo.full_name')" != "${{ github.repository }}" ]; then
              echo "::error::this is a fork PR and no branch was given; specify one explicitly, e.g. /nightly enflame main"
              exit 1
            fi
            branch=$(printf '%s' "$head_json" | jq -r '.head.ref')
          fi
          # Refuse characters that could break out of shell quoting later;
          # git refnames and platform lists are [A-Za-z0-9._/-] only.
          # grep -qEv succeeds when a line contains disallowed characters.
          if printf '%s\n%s\n' "$platforms" "$branch" | grep -qEv '^[A-Za-z0-9._/, -]*$'; then
            echo "::error::platforms/branch contain illegal characters"
            exit 1
          fi
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "Using branch: $branch, platforms: ${platforms:-all}"

      - name: React to comment (ack)
        if: always() && steps.auth.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST \
            repos/${{ github.repository }}/issues/comments/${{ github.event.client_payload.github.payload.comment.id }}/reactions \
            -f content='+1'

      - name: Trigger nightly workflow
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.parse.outputs.branch }}
          PLATFORMS: ${{ steps.parse.outputs.platforms }}
        run: |
          gh workflow run nightly.yml --repo "${{ github.repository }}" --ref "$BRANCH" \
            --field "platforms=$PLATFORMS" --field "branch=$BRANCH"

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.client_payload.github.payload.issue.number }}
          COMMENTER: ${{ github.event.client_payload.github.actor }}
          BRANCH: ${{ steps.parse.outputs.branch }}
          PLATFORMS: ${{ steps.parse.outputs.platforms }}
        run: |
          branch="$BRANCH"
          platforms="$PLATFORMS"
          scope="${platforms:-all platforms}"
          if [ "${{ steps.auth.outcome }}" = "failure" ]; then
            body="⛔ @$COMMENTER is not authorized to trigger nightly CI (need triage or higher)."
          elif [ "${{ job.status }}" = "success" ]; then
            body="🌙 Nightly CI triggered for **$scope** on branch \`$branch\` (requested by @$COMMENTER). See [Actions](${{ github.server_url }}/${{ github.repository }}/actions/workflows/nightly.yml)."
          else
            body="❌ Failed to trigger nightly CI (requested by @$COMMENTER). See [workflow log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          fi
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "$body"
