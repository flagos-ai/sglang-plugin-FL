name: MUSA SGLang 0.5.18 CI

on:
  pull_request:
    branches: [dev/0.5.18]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  workflow_dispatch:

concurrency:
  group: musa-0.5.18-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  setup:
    name: Setup (musa)
    runs-on: ci-sglang-plugin-fl-mthreads
    timeout-minutes: 20
    outputs:
      config: ${{ steps.load.outputs.config }}
    steps:
      - name: Checkout (attempt 1)
        id: checkout1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        continue-on-error: true
      - name: Checkout (attempt 2)
        id: checkout2
        if: steps.checkout1.outcome == 'failure'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        continue-on-error: true
      - name: Checkout (attempt 3)
        if: steps.checkout2.outcome == 'failure'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up configuration Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Install CI script dependencies
        run: |
          python -m venv "$RUNNER_TEMP/musa-ci-config"
          "$RUNNER_TEMP/musa-ci-config/bin/python" -m pip install pyyaml
          echo "$RUNNER_TEMP/musa-ci-config/bin" >> "$GITHUB_PATH"
      - id: load
        run: python .github/scripts/load_config.py --platform musa
      - name: Show the complete configured model matrix
        run: python .github/scripts/generate_matrix.py --platform musa

  test-musa:
    name: MUSA full test suite
    needs: setup
    runs-on: ${{ fromJson(needs.setup.outputs.config).runner_labels }}
    # A cold pull of this vendor runtime exceeded the shared unit job's 30m
    # limit before tests began. Initialize once, then run every configured scope
    # in the same container, as in the complete S5000 preflight.
    timeout-minutes: 180
    container:
      image: ${{ fromJson(needs.setup.outputs.config).ci_image }}
      volumes: ${{ fromJson(needs.setup.outputs.config).container_volumes }}
      options: ${{ fromJson(needs.setup.outputs.config).container_options }}
    steps:
      - name: Checkout (attempt 1)
        id: checkout1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        continue-on-error: true
      - name: Checkout (attempt 2)
        id: checkout2
        if: steps.checkout1.outcome == 'failure'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        continue-on-error: true
      - name: Checkout (attempt 3)
        if: steps.checkout2.outcome == 'failure'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check device availability
        run: bash .github/scripts/musa/check.sh
      - name: Install project
        run: |
          mkdir -p musa-ci-results
          bash .github/scripts/musa/setup.sh 2>&1 | tee musa-ci-results/setup.log
      - name: Unit tests
        timeout-minutes: 15
        run: python tests/run.py --platform musa --scope unit 2>&1 | tee musa-ci-results/unit.log
      - name: Functional tests
        id: functional
        timeout-minutes: 15
        run: python tests/run.py --platform musa --scope functional 2>&1 | tee musa-ci-results/functional.log

      # Retain the reusable workflow's fail-fast=false behavior across the
      # three E2E groups: one failing group must not suppress the other two.
      - name: Inference tests (all configured S5000 models)
        id: inference
        if: ${{ !cancelled() && steps.functional.outcome == 'success' }}
        timeout-minutes: 60
        run: python tests/run.py --platform musa --device s5000 --scope e2e --task inference 2>&1 | tee musa-ci-results/inference.log
      - name: Concurrent tests (all configured S5000 models)
        id: concurrent
        if: ${{ !cancelled() && steps.functional.outcome == 'success' }}
        timeout-minutes: 60
        run: python tests/run.py --platform musa --device s5000 --scope e2e --task concurrent 2>&1 | tee musa-ci-results/concurrent.log
      - name: Serving tests (all configured S5000 models)
        id: serving
        if: ${{ !cancelled() && steps.functional.outcome == 'success' }}
        timeout-minutes: 60
        run: python tests/run.py --platform musa --device s5000 --scope e2e --task serving 2>&1 | tee musa-ci-results/serving.log
      - name: Benchmark smoke tests
        if: >-
          ${{ !cancelled() &&
              steps.inference.outcome == 'success' &&
              steps.concurrent.outcome == 'success' &&
              steps.serving.outcome == 'success' }}
        timeout-minutes: 30
        run: python tests/run.py --platform musa --scope benchmark 2>&1 | tee musa-ci-results/benchmark.log

      - name: Upload MUSA test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: musa-ci-results
          path: musa-ci-results/
