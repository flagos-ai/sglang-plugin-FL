# NVIDIA-only CI for the SGLang 0.5.18 development line.
# Other backends stay disabled until their dedicated 0.5.18 upgrades begin.
name: CI

on:
  schedule:
    - cron: "0 18 * * *" # daily at 2:00 AM CST (UTC+8)
  push:
    branches: ["dev/0.5.18"]
  pull_request:
    branches: ["dev/0.5.18"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "examples/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    uses: ./.github/workflows/_lint.yml

  build:
    needs: lint
    uses: ./.github/workflows/_build_wheel.yml

  test-cuda:
    needs: build
    uses: ./.github/workflows/_platform_test.yml
    with:
      platform: cuda
    secrets: inherit
