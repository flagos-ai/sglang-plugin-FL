# CI workflow for the SGLang 0.5.18 development line.
# NVIDIA and MUSA are enabled; the other backends remain temporarily disabled.
name: CI

on:
  schedule:
    - cron: "0 18 * * *" # daily at 2:00 AM CST (UTC+8)
  push:
    branches: ["dev/0.5.18"]
  pull_request:
    branches: ["dev/0.5.18"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "examples/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    uses: ./.github/workflows/_lint.yml

  build:
    needs: lint
    uses: ./.github/workflows/_build_wheel.yml

  discover:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.detect.outputs.platforms }}
    steps:
      - name: Checkout (attempt 1)
        id: checkout1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: |
            .github/configs
            .github/scripts
        continue-on-error: true
      - name: Checkout (attempt 2)
        id: checkout2
        if: steps.checkout1.outcome == 'failure'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: |
            .github/configs
            .github/scripts
        continue-on-error: true
      - name: Checkout (attempt 3)
        if: steps.checkout2.outcome == 'failure'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: |
            .github/configs
            .github/scripts
      - name: Install CI script dependencies
        run: pip install pyyaml
      - name: Detect available platforms
        id: detect
        run: python3 .github/scripts/detect_platforms.py

  test-cuda:
    needs: discover
    if: contains(fromJson(needs.discover.outputs.platforms), 'cuda')
    uses: ./.github/workflows/_platform_test.yml
    with:
      platform: cuda
    secrets: inherit

  # Retained for the upcoming Ascend 0.5.18 adaptation.
  test-ascend:
    needs: discover
    if: contains(fromJson(needs.discover.outputs.platforms), 'ascend')
    uses: ./.github/workflows/_platform_test.yml
    with:
      platform: ascend
    secrets: inherit

  # Moore Threads MUSA uses the same platform entrypoint as NVIDIA.
  test-musa:
    needs: discover
    if: contains(fromJson(needs.discover.outputs.platforms), 'musa')
    uses: ./.github/workflows/_platform_test.yml
    with:
      platform: musa
    secrets: inherit

  # Retained for the upcoming T-Head PPU 0.5.18 adaptation.
  test-thead:
    needs: discover
    if: contains(fromJson(needs.discover.outputs.platforms), 'thead')
    uses: ./.github/workflows/_platform_test.yml
    with:
      platform: thead
    secrets: inherit
