# Per-platform test workflow, invoked by ci.yml via workflow_call (one job per platform).
#
# Main steps:
# 1. setup:      Load platform config and generate test matrices
# 2. unit:       Run unit tests with platform-specific include/exclude patterns
# 3. functional: Run component-level GPU tests (ops, compilation, distributed) — fast
# 4. e2e:        Run end-to-end model tests (inference, serving) — slow, needs model files
# 5. benchmark:  Run benchmark smoke tests (throughput, latency, serve entrypoints)
# 6. notify:     Send Feishu notification with overall platform status
#
# MUSA retains these scopes in one Actions job container to avoid repeated
# cold pulls of its 30 GiB image. Other platforms keep the existing job chain.
#
# Users can modify test settings in tests/platforms/*.yaml:
# - e2e: Add/remove model test cases in the support lists
# - functional: Adjust include/exclude patterns for component tests
# - unit: Add/remove paths in include and exclude lists
# - tolerance: Adjust numerical comparison tolerance for result validation
# - unsupported_features: Exclude test cases matching specific feature tags
name: Platform Test

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
    secrets:
      FEISHU_APP_ID:
        required: false
      FEISHU_APP_SECRET:
        required: false
      FEISHU_CHAT_ID:
        required: false

jobs:
  setup:
    name: "Setup (${{ inputs.platform }})"
    runs-on: ubuntu-latest
    outputs:
      config: ${{ steps.load.outputs.config }}
      e2e_matrix: ${{ steps.matrix.outputs.e2e }}
    steps:
      - name: Checkout (attempt 1)
        id: checkout1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
        continue-on-error: true
      - name: Checkout (attempt 2)
        id: checkout2
        if: steps.checkout1.outcome == 'failure'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
        continue-on-error: true
      - name: Checkout (attempt 3)
        if: steps.checkout2.outcome == 'failure'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Install CI script dependencies
        run: pip install pyyaml
      - id: load
        run: python .github/scripts/load_config.py --platform ${{ inputs.platform }}
      - name: Check MUSA CI helpers
        if: inputs.platform == 'musa'
        run: python -m unittest discover -s .github/scripts/musa -p 'test_*.py'
      - id: changes
        name: Detect changed files (PR only)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.sha }} > /tmp/changed_files.txt
            echo "file=/tmp/changed_files.txt" >> "$GITHUB_OUTPUT"
          else
            echo "file=" >> "$GITHUB_OUTPUT"
          fi
      - id: matrix
        run: |
          CHANGED_ARG=""
          if [ -n "${{ steps.changes.outputs.file }}" ]; then
            CHANGED_ARG="--changed-files ${{ steps.changes.outputs.file }}"
          fi
          python .github/scripts/generate_matrix.py \
            --platform ${{ inputs.platform }} \
            $CHANGED_ARG

  unit:
    if: inputs.platform != 'musa'
    needs: [setup]
    uses: ./.github/workflows/_unit_test.yml
    with:
      platform: ${{ inputs.platform }}
      ci_image: ${{ fromJson(needs.setup.outputs.config).ci_image }}
      runner_labels: ${{ toJson(fromJson(needs.setup.outputs.config).runner_labels) }}
      container_volumes: ${{ toJson(fromJson(needs.setup.outputs.config).container_volumes) }}
      container_options: ${{ fromJson(needs.setup.outputs.config).container_options }}

  functional:
    if: inputs.platform != 'musa'
    needs: [setup, unit]
    uses: ./.github/workflows/_functional_test.yml
    with:
      platform: ${{ inputs.platform }}
      ci_image: ${{ fromJson(needs.setup.outputs.config).ci_image }}
      runner_labels: ${{ toJson(fromJson(needs.setup.outputs.config).runner_labels) }}
      container_volumes: ${{ toJson(fromJson(needs.setup.outputs.config).container_volumes) }}
      container_options: ${{ fromJson(needs.setup.outputs.config).container_options }}

  e2e:
    needs: [setup, functional]
    if: inputs.platform != 'musa' && needs.setup.outputs.e2e_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.setup.outputs.e2e_matrix) }}
    uses: ./.github/workflows/_e2e_test.yml
    with:
      platform: ${{ inputs.platform }}
      task: ${{ matrix.test.task }}
      device: ${{ matrix.test.device }}
      cases: ${{ matrix.test.cases }}
      ci_image: ${{ fromJson(needs.setup.outputs.config).ci_image }}
      runner_labels: ${{ toJson(fromJson(needs.setup.outputs.config).runner_labels) }}
      container_volumes: ${{ toJson(fromJson(needs.setup.outputs.config).container_volumes) }}
      container_options: ${{ fromJson(needs.setup.outputs.config).container_options }}
      timeout: ${{ matrix.test.timeout || 60 }}

  benchmark:
    if: inputs.platform != 'musa'
    needs: [setup, e2e]
    uses: ./.github/workflows/_benchmark_test.yml
    with:
      platform: ${{ inputs.platform }}
      ci_image: ${{ fromJson(needs.setup.outputs.config).ci_image }}
      runner_labels: ${{ toJson(fromJson(needs.setup.outputs.config).runner_labels) }}
      container_volumes: ${{ toJson(fromJson(needs.setup.outputs.config).container_volumes) }}
      container_options: ${{ fromJson(needs.setup.outputs.config).container_options }}
      timeout: 30

  musa:
    name: MUSA full test suite
    needs: setup
    if: inputs.platform == 'musa'
    defaults:
      run:
        shell: bash
    runs-on: ${{ fromJson(needs.setup.outputs.config).runner_labels }}
    # A cold pull of this vendor runtime exceeded the shared unit job's 30m
    # limit before tests began. Initialize once, then run every configured scope
    # in the same container, as in the complete S5000 preflight.
    timeout-minutes: 180
    container:
      image: ${{ fromJson(needs.setup.outputs.config).ci_image }}
      volumes:
        - ${{ fromJson(needs.setup.outputs.config).container_volumes[0] }}
      options: ${{ fromJson(needs.setup.outputs.config).container_options }}
    steps:
      - name: Checkout (attempt 1)
        id: checkout1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        continue-on-error: true
      - name: Checkout (attempt 2)
        id: checkout2
        if: steps.checkout1.outcome == 'failure'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        continue-on-error: true
      - name: Checkout (attempt 3)
        if: steps.checkout2.outcome == 'failure'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check device availability
        run: |
          mkdir -p musa-ci-results
          bash .github/scripts/musa/check.sh 2>&1 | tee musa-ci-results/device.log
      - name: Install project
        run: bash .github/scripts/musa/setup.sh 2>&1 | tee musa-ci-results/setup.log
      - name: Unit tests
        timeout-minutes: 15
        run: python tests/run.py --platform musa --scope unit 2>&1 | tee musa-ci-results/unit.log
      - name: Functional tests
        id: functional
        timeout-minutes: 15
        run: python tests/run.py --platform musa --scope functional 2>&1 | tee musa-ci-results/functional.log

      # Retain the reusable workflow's fail-fast=false behavior across the
      # three E2E groups: one failing group must not suppress the other two.
      - name: Inference tests (all configured S5000 models)
        id: inference
        if: ${{ !cancelled() && steps.functional.outcome == 'success' }}
        timeout-minutes: 60
        run: python tests/run.py --platform musa --device s5000 --scope e2e --task inference 2>&1 | tee musa-ci-results/inference.log
      - name: Upload inference log immediately
        if: ${{ always() && steps.inference.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: musa-inference-log
          path: musa-ci-results/inference.log
      - name: Concurrent tests (all configured S5000 models)
        id: concurrent
        if: ${{ !cancelled() && steps.functional.outcome == 'success' }}
        timeout-minutes: 60
        run: python tests/run.py --platform musa --device s5000 --scope e2e --task concurrent 2>&1 | tee musa-ci-results/concurrent.log
      - name: Upload concurrent log immediately
        if: ${{ always() && steps.concurrent.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: musa-concurrent-log
          path: musa-ci-results/concurrent.log
      - name: Serving tests (all configured S5000 models)
        id: serving
        if: ${{ !cancelled() && steps.functional.outcome == 'success' }}
        timeout-minutes: 60
        run: python tests/run.py --platform musa --device s5000 --scope e2e --task serving 2>&1 | tee musa-ci-results/serving.log
      - name: Upload serving log immediately
        if: ${{ always() && steps.serving.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: musa-serving-log
          path: musa-ci-results/serving.log
      - name: Benchmark smoke tests
        if: >-
          ${{ !cancelled() &&
              steps.inference.outcome == 'success' &&
              steps.concurrent.outcome == 'success' &&
              steps.serving.outcome == 'success' }}
        timeout-minutes: 30
        run: python tests/run.py --platform musa --scope benchmark 2>&1 | tee musa-ci-results/benchmark.log
      - name: Upload MUSA test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: musa-ci-results
          path: musa-ci-results/

  notify:
    needs: [unit, functional, e2e, benchmark, musa]
    if: always()
    uses: ./.github/workflows/_notify_feishu.yml
    with:
      platform: ${{ inputs.platform }}
      status: >-
        ${{ inputs.platform == 'musa' &&
            (needs.musa.result == 'success' && 'success' ||
             needs.musa.result == 'cancelled' && 'cancelled' || 'failure') ||
            (needs.unit.result == 'success' &&
             needs.functional.result == 'success' &&
             (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') &&
             (needs.benchmark.result == 'success' || needs.benchmark.result == 'skipped'))
            && 'success'
            || (needs.unit.result == 'cancelled' ||
                needs.functional.result == 'cancelled' ||
                needs.e2e.result == 'cancelled' ||
                needs.benchmark.result == 'cancelled')
               && 'cancelled'
               || 'failure' }}
    secrets:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
