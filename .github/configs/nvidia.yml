# NVIDIA Hardware Configuration
# This file defines CI/CD settings for NVIDIA GPU testing.

platform: nvidia

# Docker image: SGLang 0.5.18 standard wheel on the immutable operations
# runtime (flagos-runtime-nvidia-cuda13.3), built by
# docker/cuda/runtime-0.5.18.containerfile. Published tag:
# 0.5.18-nvidia-runtime-ci-20261110; digest-pinned (previously a mutable
# tag built from the legacy docker/cuda/containerfile, which replaced
# Triton/FlagTree/FlagGems inside the image).
# The operations-runtime image is ~20 GB; a cold runner spends most of an
# hour pulling it, so all platform stages get 180 minutes.
test_timeout: 180

ci_image: harbor.baai.ac.cn/flagos-dev/sglang-plugin-fl@sha256:20b2b506cbd353a6b8f4d4c210cc8b4344f765c226f24c1318bc5deff31285c0

# Runner labels for this hardware
runner_labels:
  - ci-sglang-plugin-fl-nvidia

# Container volumes (hardware-specific paths)
container_volumes:
  - /mnt/airs-business/cicd/models:/data/models/Qwen

# Container options (no --privileged). The NVIDIA self-hosted runner already
# provides GPU access through its configured Docker runtime; keep the options
# aligned with that validated runner instead of requiring a named runtime.
# --user root is required: CI images install CUDA/NCCL libs under system paths,
# and pip install needs write access to /usr/local. This matches org convention.
# --init: tini as PID 1 reaps orphan zombies from sglang TP workers on shutdown
# (PID 1 was tail -f /dev/null, never wait()s -> zombies pile up, kill_process_tree times out)
# The A100 runner exercises different Triton shapes from the validated H100/H20
# environments. Keep its provisional correctness fallbacks CI-local instead of
# changing the NVIDIA runtime defaults. Both variables replace (not extend) the
# plugin YAML lists, so each value includes the complete fallback set.
container_options: >-
  --hostname sglang-plugin-fl
  --ipc=host
  --shm-size=64g
  --ulimit memlock=-1
  --ulimit stack=67108864
  --user root
  -e NVIDIA_VISIBLE_DEVICES=all
  -e NVIDIA_DRIVER_CAPABILITIES=compute,utility
  -e SGLANG_FL_FLAGOS_BLACKLIST=slice,masked_scatter_,index_put_,_index_put_impl_,count_nonzero,mm,linear,any_dim
  -e SGLANG_FL_OOT_BLACKLIST=TopK,SiluAndMul
  --init
