# Platform registry — controls which platforms are tested in CI.
#
# Each key under `platforms` must match a config file name in this directory
# (e.g., "cuda" -> cuda.yml, "ascend" -> ascend.yml).
#
# Set `enabled: false` to skip a platform without removing its config file.

platforms:
  cuda:
    enabled: true
  ascend:
    # Enable only after empty-0.5.18.containerfile has been built on ARM64,
    # validated on 910C, pushed, and ascend.yml is pinned to its real digest.
    enabled: false
  musa:
    enabled: true
  thead:
    # Self-hosted runner pool: label flagcicd-810e (4 runners, online).
    # CI image: harbor.baai.ac.cn/flagos-dev/sglang-plugin-fl:0.2.0-thead-ci.
    # Temporarily disabled until the dedicated SGLang 0.5.18 adaptation is merged.
    enabled: false
