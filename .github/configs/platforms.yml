# Platform registry — controls which platforms are tested in CI.
# Each key under `platforms` must match a config file name in this directory
# (e.g., "nvidia" -> nvidia.yml); set `enabled: false` to skip a platform
# without removing its config file.
#
# Diff-based routing (ported from vllm-plugin-FL #581): a changed file
# matching global_trigger_paths runs ALL enabled platforms; a file matching a
# platform's trigger_paths runs that platform only; exempt_from_global carves
# platform-owned files out of the global set (every exempt entry must also
# appear in that platform's trigger_paths - detect_platforms.py errors
# otherwise). Files matching no rule at all fall back to a full run (safe
# direction).

global_trigger_paths:
  # Shared plugin source; per-platform dispatch configs carved out below.
  - sglang_fl/
  - tests/
  - benchmarks/
  - .github/scripts/
  - .github/configs/
  - .github/workflows/
  - pyproject.toml
  - .pre-commit-config.yaml
  - _typos.toml

platforms:
  nvidia:
    enabled: false
    trigger_paths:
      - sglang_fl/dispatch/config/nvidia.yaml
      - .github/scripts/nvidia/
      - .github/configs/nvidia.yml
      - tests/platforms/nvidia.yaml
      - docker/cuda/
    exempt_from_global:
      - sglang_fl/dispatch/config/nvidia.yaml
      - .github/scripts/nvidia/
      - .github/configs/nvidia.yml
      - tests/platforms/nvidia.yaml
  ascend:
    enabled: false
    trigger_paths:
      - sglang_fl/dispatch/config/ascend.yaml
      - .github/scripts/ascend/
      - .github/configs/ascend.yml
      - tests/platforms/ascend.yaml
      - docker/ascend/
      # Executed directly by the Ascend functional job (_functional_test.yml).
      - examples/ascend_compat_probe.py
    exempt_from_global:
      - sglang_fl/dispatch/config/ascend.yaml
      - .github/scripts/ascend/
      - .github/configs/ascend.yml
      - tests/platforms/ascend.yaml
  musa:
    enabled: false
    trigger_paths:
      - sglang_fl/dispatch/config/musa.yaml
      - .github/scripts/musa/
      - .github/configs/musa.yml
      - tests/platforms/musa.yaml
      - docker/mthreads/
    exempt_from_global:
      - sglang_fl/dispatch/config/musa.yaml
      - .github/scripts/musa/
      - .github/configs/musa.yml
      - tests/platforms/musa.yaml
  iluvatar:
    enabled: false
    trigger_paths:
      - sglang_fl/dispatch/config/iluvatar.yaml
      - .github/scripts/iluvatar/
      - .github/configs/iluvatar.yml
      - docker/iluvatar/
    exempt_from_global:
      - sglang_fl/dispatch/config/iluvatar.yaml
      - .github/scripts/iluvatar/
      - .github/configs/iluvatar.yml
  thead:
    # Self-hosted runner pool: label flagcicd-810e (4 runners, online).
    # CI image: harbor.baai.ac.cn/flagos-dev/sglang-plugin-fl:0.2.0-thead-ci.
    enabled: false
    trigger_paths:
      - sglang_fl/dispatch/config/tsingmicro.yaml
      - .github/scripts/thead/
      - .github/configs/thead.yml
      - tests/platforms/thead.yaml
      - docker/thead/
    exempt_from_global:
      - sglang_fl/dispatch/config/tsingmicro.yaml
      - .github/scripts/thead/
      - .github/configs/thead.yml
      - tests/platforms/thead.yaml
  hygon:
    # Self-hosted runner pool: label ci-sglang-plugin-fl-hygon (8x BW1000 DCU).
    # CI image: harbor.baai.ac.cn/flagos-dev/sglang-plugin-fl:0.2.0-hygon-ci.
    enabled: true
    trigger_paths:
      - sglang_fl/dispatch/config/hygon.yaml
      - .github/scripts/hygon/
      - .github/configs/hygon.yml
      - tests/platforms/hygon.yaml
      - docker/hygon/
    exempt_from_global:
      - sglang_fl/dispatch/config/hygon.yaml
      - .github/scripts/hygon/
      - .github/configs/hygon.yml
      - tests/platforms/hygon.yaml

  kunlunxin:
    # harbor CI image from docker/kunlunxin/ci-0.5.18.containerfile are ready.
    # Local matrix: tests/platforms/kunlunxin.yaml.
    enabled: true
