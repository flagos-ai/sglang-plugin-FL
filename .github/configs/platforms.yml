# Platform registry — controls which platforms are tested in CI.
#
# Each key under `platforms` must match a config file name in this directory
# (e.g., "cuda" -> cuda.yml, "ascend" -> ascend.yml).
#
# Set `enabled: false` to skip a platform without removing its config file.

# TEMPORARY probe branch (thead runtime image hardware validation):
# every platform except thead is disabled so the run cannot consume other
# pools. Do not merge this change; it lives only on probe/thead-rt163f-hw.
platforms:
  cuda:
    enabled: false
  ascend:
    # Published image is pinned to its Harbor digest and passed the four-card
    # baked-image gate; CI now validates the dedicated runner's non-privileged path.
    enabled: false
  musa:
    enabled: false
  iluvatar:
    enabled: false
  thead:
    # Self-hosted runner pool: label flagcicd-810e (4 runners, online).
    # SGLang 0.5.18 empty-mode CI image is set in thead.yml; it must be built from
    # docker/thead/empty-0.5.18.containerfile and pushed before this runs green.
    enabled: true

  hygon:
    # Validated SGLang 0.5.18 image is pinned in hygon.yml.
    enabled: false
