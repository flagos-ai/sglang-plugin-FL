# Hygon DCU (BW1000) Hardware Configuration
# This file defines CI/CD settings for Hygon DCU testing.

platform: hygon

# Docker image for this hardware: SGLang 0.5.18+flagos on the immutable
# operations runtime (flagos-runtime-hygon-dtk26.04), built by
# docker/hygon/runtime-0.5.18.containerfile. Published tag:
# 0.5.18-hygon-runtime-ci-20261112-appfix4; digest-pinned. The old development
# image (and main's 0.5.5.11-era image) is rejected by setup. This image also
# carries the HCU compatibility patches applied to the SGLang wheel (see
# docker/hygon/sglang-v0.5.18-hcu.patch), import-only stubs for the
# sgl_kernel/flashinfer wheels HCU does not ship, and the baked DTK loader
# path, so plain BF16 startup imports neither AMD AITER nor sgl_kernel on
# HCU and the container is host-independent.
# The operations-runtime image is ~18 GB; a cold runner spends most of an
# hour pulling it, so all platform stages get 180 minutes.
test_timeout: 180

ci_image: harbor.baai.ac.cn/flagos-dev/sglang-plugin-fl@sha256:c9263b11500c897748c48775b6be521b8ffc84d2736ea681d6e5f8325ed2271b

# Runner labels for this hardware
runner_labels:
  - ci-sglang-plugin-fl-hygon

# Container volumes (hardware-specific paths).
# The CI image ships only the DTK userspace; the DCU driver userspace lives on
# the host under /opt/hyhal (+/usr/local/hyhal) and MUST be bind-mounted, or
# torch fails to load librocm_smi64.so.2 (same convention as vllm-plugin-FL's
# hygon.yml). Models live under /data/models/Qwen and the test configs
# reference that path in-container, so /data is mounted at the same path.
container_volumes:
  - /opt/hyhal:/opt/hyhal
  - /usr/local/hyhal:/usr/local/hyhal
  - /data:/data
  # Main model YAMLs use this host store; HCU TP2 profiles use /models.
  - /data/models/Qwen:/models:ro

# Container options.
# DCU device access: the host docker daemon has no hygon container runtime;
# the DCU is exposed via the KFD/DRM char devices (/dev/kfd compute, /dev/mkfd
# new-format compute, /dev/dri render nodes), passed with --device, plus
# --group-add video for /dev/dri permissions. This matches the validated
# vLLM-on-DCU recipe (vllm-plugin-FL .github/configs/hygon.yml).
# --user root is required: the setup.sh step pip-installs the plugin into
# /usr/local. --init: tini as PID 1 reaps orphaned sglang TP workers.
# GEMS_VENDOR is not passed here: the CI image bakes it (docker/hygon/
# containerfile ENV), needed there at FlagGems-rebuild time anyway.
container_options: >-
  --hostname sglang-plugin-fl
  --ipc=host
  --shm-size=64g
  --ulimit memlock=-1
  --ulimit stack=67108864
  --user root
  --init
  -e TORCH_DEVICE_BACKEND_AUTOLOAD=0
  -e SGLANG_CUDA_COREDUMP_BEFORE_CRASH_WAIT_SECS=0
  --device /dev/kfd
  --device /dev/mkfd
  --device /dev/dri
  --group-add video
