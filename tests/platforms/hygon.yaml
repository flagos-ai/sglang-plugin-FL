# Hygon BW1000 development acceptance for the documented empty image.
# The same eager/graph profiles are consumed by local acceptance and CI.
# CI runner/image enablement is managed in .github/configs/platforms.yml.
# Eager: python tests/run.py --platform hygon --device bw1000 --scope e2e
# Graph: python tests/run.py --platform hygon --device bw1000_graph --scope e2e
platform: hygon
vendor: hygon

device_types:
  bw1000:
    tags: [hygon, hcu, dcu, bf16]
  bw1000_graph:
    tags: [hygon, hcu, dcu, bf16, decode_graph]

tolerance:
  inference:
    default: {rtol: 1e-5, atol: 1e-8}
    bfloat16: {rtol: 1e-3, atol: 1e-3}

# Keep graph acceptance explicit and use the SGLang 0.5.18 per-phase API.
# The vendor backend supports standard decode graphs, with prefill eager.
device_overrides:
  bw1000_graph:
    engine_overrides:
      qwen3_6:
        27b_tp2_hygon: &graph_engine
          disable_cuda_graph: false
          cuda_graph_backend_decode: full
          cuda_graph_backend_prefill: disabled
          cuda_graph_max_bs_decode: 16
        35b_a3b_tp2_hygon: *graph_engine
unsupported_features: []

# Existing shell values take precedence. Dispatch policy comes from the
# packaged Hygon runtime defaults instead of a second copy of the whitelist.
env_defaults:
  # The base image's pip flagcx Torch extension is CUDA-only. The plugin uses
  # its native FlagCX wrapper; do not autoload that optional device extension.
  TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
  USE_FLAGGEMS: "1"
  USE_FLAGTUNE: "0"
  SGLANG_PLUGINS: sglang_fl
  FLAGCX_PATH: /sgl-workspace/FlagCX
  SGLANG_FL_DIST_BACKEND: flagcx

bw1000: &bw1000_profile
  name: bw1000
  tests: &bw1000_tests
    unit:
      include: "*"
      # The Iluvatar import-shim contract asserts that unknown sgl_kernel/
      # flashinfer imports fail honestly. The HCU CI image instead installs
      # a meta-path stub finder that fabricates exactly those modules (HCU
      # ships no such wheels), so the honesty probes cannot hold on this
      # lane; the Iluvatar CI lane retains their full coverage.
      exclude:
        - platform/test_iluvatar_import_shims.py
        # TEMP(probe): kunlunxin's platform-owned unit tests (dev/0.5.18
        # #155) import vendor code absent from this probe's wheel, which was
        # staged from 3cb3f31 (pre-#155). For this old-wheel probe only;
        # REMOVE once the formal image is rebuilt from the final source tree
        # (the wheel then contains #155 and these tests collect and hold).
        - kunlunxin/
        # TEMP(probe): the kunlunxin flagcx API contract patches seams
        # (find_spec / _import_flagcx_api) that only exist in post-#155
        # flagcx.py; this probe's pre-#155 wheel lacks them at RUNTIME
        # (collection passes, 6 hardware failures, run 44456739955).
        # REMOVE with the formal rebuild.
        - distributed/test_kunlunxin_flagcx_api.py
        # TEMP(probe): the iluvatar benchmark CLI contract pins the
        # checkout-mode pytest argv (relative test paths), but wheel mode
        # necessarily absolutizes run.py's case targets (children run from
        # the staging dir). Mode-vs-contract skew, not vendor skew; NO
        # wheel rebuild fixes it. The product fix belongs to the two-wheel
        # fold (make the contract test mode-aware); this lane exclusion
        # only unblocks the probe.
        - test_iluvatar_benchmark_config.py
        # TEMP(probe): the thead platform unit tests (dev/0.5.18 #160)
        # import vendor.thead at module scope; this probe's wheel was
        # staged from 3cb3f31 (pre-#160) and carries no vendor.thead
        # package, so collection fails with ImportError (run 44489953257,
        # 4 files). REMOVE once the formal image is rebuilt from the final
        # source tree (the wheel then contains #160 and these tests
        # collect and hold). The three thead tests that stub sys.modules
        # themselves are kept: they do not need the real package.
        - platform/test_thead_graph_capture_status.py
        - platform/test_thead_import_guard.py
        - platform/test_thead_runtime_config.py
        - platform/test_thead_sgl_kernel_compat.py
    functional:
      include: "*"
      # build-infra#1786 (FlagTree JIT device-lib discovery) is fixed by the
      # baked clang wrapper in the runtime image; the mtp_logprobs suite is
      # its regression gate (10/10 green on appfix7 and on the triton-path
      # experiment run 43830080069). The mtp_attention 256-prefix cases stay
      # excluded: they call the vendor FlashAttention implementation directly
      # (build-infra#1787, vendor-wontfix), so the e2e-level
      # SGLANG_HYGON_DIAGNOSTIC_TRITON_ATTENTION override cannot reach them
      # (proven by run 43830080069: 2 failed / 54 passed under the switch).
      # Restoring them needs a dispatch-layer routing decision.
      exclude:
        - ops/test_hygon_mtp_attention.py
        # TEMP(probe): same pre-#155 wheel reasoning as the kunlunxin/ unit
        # exclusion above; REMOVE with the formal rebuild.
        - ops/test_kunlunxin_ops.py
    e2e:
      # PR acceptance runs the representative eager model through inference
      # and serving; concurrent/mtp stay in nightly (scheduled workflows only
      # fire on the default branch) and the graph profile covers the graph
      # matrix below.
      pr:
        inference:
          qwen3_6: [27b_tp2_hygon]
        serving:
          qwen3_6: [27b_tp2_hygon]
      nightly:
        inference: &hcu_model_cases
          qwen3_6: [27b_tp2_hygon, 35b_a3b_tp2_hygon]
        serving: *hcu_model_cases
        concurrent: *hcu_model_cases
        mtp: *hcu_model_cases
    # Benchmark and two-node TP2/PP2 acceptance are separate opt-in runs.
    benchmark:
      enabled: false
      smoke: []

bw1000_graph:
  <<: *bw1000_profile
  name: bw1000_graph
  tests:
    <<: *bw1000_tests
    # Explicitly retain the three standard graph tasks without inheriting MTP.
    e2e:
      # Temporarily covered by the eager diagnostic above; the complete graph
      # matrix remains available to nightly and must return to PR acceptance.
      pr: {}
      nightly:
        inference: *hcu_model_cases
        serving: *hcu_model_cases
        concurrent: *hcu_model_cases
