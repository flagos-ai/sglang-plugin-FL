# Hygon BW1000 development acceptance for the documented empty image.
# The same eager/graph profiles are consumed by local acceptance and CI.
# CI runner/image enablement is managed in .github/configs/platforms.yml.
# Eager: python tests/run.py --platform hygon --device bw1000 --scope e2e
# Graph: python tests/run.py --platform hygon --device bw1000_graph --scope e2e
platform: hygon
vendor: hygon

device_types:
  bw1000:
    tags: [hygon, hcu, dcu, bf16]
  bw1000_graph:
    tags: [hygon, hcu, dcu, bf16, decode_graph]

tolerance:
  inference:
    default: {rtol: 1e-5, atol: 1e-8}
    bfloat16: {rtol: 1e-3, atol: 1e-3}

# Keep graph acceptance explicit and use the SGLang 0.5.18 per-phase API.
# The vendor backend supports standard decode graphs, with prefill eager.
device_overrides:
  bw1000_graph:
    engine_overrides:
      qwen3_6:
        27b_tp2_hygon: &graph_engine
          disable_cuda_graph: false
          cuda_graph_backend_decode: full
          cuda_graph_backend_prefill: disabled
          cuda_graph_max_bs_decode: 16
        35b_a3b_tp2_hygon: *graph_engine
unsupported_features: []

# Existing shell values take precedence. Dispatch policy comes from the
# packaged Hygon runtime defaults instead of a second copy of the whitelist.
env_defaults:
  # The base image's pip flagcx Torch extension is CUDA-only. The plugin uses
  # its native FlagCX wrapper; do not autoload that optional device extension.
  TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
  USE_FLAGGEMS: "1"
  USE_FLAGTUNE: "0"
  SGLANG_PLUGINS: sglang_fl
  FLAGCX_PATH: /sgl-workspace/FlagCX
  SGLANG_FL_DIST_BACKEND: flagcx

bw1000: &bw1000_profile
  name: bw1000
  tests: &bw1000_tests
    unit:
      include: "*"
      # TEMP validation-only: dev/0.5.18 gained the txda vendor package
      # (#187) after the candidate images were built, so their installed
      # sglang_fl wheel cannot import it. Drop this entry with the probe.
      exclude:
        - platform/test_tsingmicro_dummy_weights.py
        - platform/test_tsingmicro_eagle_runtime.py
        - platform/test_tsingmicro_fused_moe.py
        - platform/test_tsingmicro_gdn_verify_conv.py
        - platform/test_tsingmicro_gemma_rms_norm.py
        - platform/test_tsingmicro_kv_leak_fix.py
        - platform/test_tsingmicro_model_runner_timer.py
        - platform/test_tsingmicro_plugin_bootstrap.py
        - platform/test_tsingmicro_post_import_hook.py
        - platform/test_tsingmicro_speculative_cache_locs.py
        - platform/test_tsingmicro_speculative_tree.py
        - platform/test_sglang_version_compat.py
        # TEMP validation-only: dev/0.5.18 moved on again after the candidate
        # images were built ( communicator hooks, FlagCX API, ascend GDN);
        # their installed sglang_fl wheel predates those changes.
        - distributed/test_communicator_hooks.py
        - distributed/test_flagcx.py
        - distributed/test_kunlunxin_flagcx_api.py
        - flaggems/test_setup_flaggems.py
        - platform/test_ascend_sglang_compat.py
    functional:
      include: "*"
      # Runtime FlashAttention has a vendor-confirmed wont-fix for the
      # paged-KV BF16/GQA head_dim=256 MTP shape in this test file. Keep the
      # source test unchanged and exclude only this Hygon-specific regression
      # until the Runtime provides a corrected kernel.
      exclude:
        - ops/test_hygon_mtp_attention.py
    e2e:
      # concurrent/mtp stay in the pr stage: scheduled workflows only fire on
      # the default branch, so until this line merges back the nightly stage
      # has no automatic trigger and per-PR runs are the only coverage.
      pr:
        inference: &hcu_model_cases
          qwen3_6: [27b_tp2_hygon, 35b_a3b_tp2_hygon]
        serving: *hcu_model_cases
        concurrent: *hcu_model_cases
        # Only the eager profile runs speculative model acceptance.
        mtp: *hcu_model_cases
      nightly:
        inference: *hcu_model_cases
        serving: *hcu_model_cases
        concurrent: *hcu_model_cases
        mtp: *hcu_model_cases
    # Benchmark and two-node TP2/PP2 acceptance are separate opt-in runs.
    benchmark:
      enabled: false
      smoke: []

bw1000_graph:
  <<: *bw1000_profile
  name: bw1000_graph
  tests:
    <<: *bw1000_tests
    # Explicitly retain the three standard graph tasks without inheriting MTP.
    e2e:
      pr:
        inference: *hcu_model_cases
        serving: *hcu_model_cases
        concurrent: *hcu_model_cases
      nightly:
        inference: *hcu_model_cases
        serving: *hcu_model_cases
        concurrent: *hcu_model_cases
