# Hygon BW1000 development acceptance for the documented empty image.
# The same eager/graph profiles are consumed by local acceptance and CI.
# CI runner/image enablement is managed in .github/configs/platforms.yml.
# Eager: python tests/run.py --platform hygon --device bw1000 --scope e2e
# Graph: python tests/run.py --platform hygon --device bw1000_graph --scope e2e
platform: hygon
vendor: hygon

device_types:
  bw1000:
    tags: [hygon, hcu, dcu, bf16]
  bw1000_graph:
    tags: [hygon, hcu, dcu, bf16, decode_graph]

tolerance:
  inference:
    default: {rtol: 1e-5, atol: 1e-8}
    bfloat16: {rtol: 1e-3, atol: 1e-3}

# Keep graph acceptance explicit and use the SGLang 0.5.18 per-phase API.
# The vendor backend supports standard decode graphs, with prefill eager.
device_overrides:
  bw1000_graph:
    engine_overrides:
      qwen3_6:
        27b_tp2_hygon: &graph_engine
          disable_cuda_graph: false
          cuda_graph_backend_decode: full
          cuda_graph_backend_prefill: disabled
          cuda_graph_max_bs_decode: 16
        35b_a3b_tp2_hygon: *graph_engine
unsupported_features: []

# Existing shell values take precedence. Dispatch policy comes from the
# packaged Hygon runtime defaults instead of a second copy of the whitelist.
env_defaults:
  # The base image's pip flagcx Torch extension is CUDA-only. The plugin uses
  # its native FlagCX wrapper; do not autoload that optional device extension.
  TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
  USE_FLAGGEMS: "1"
  USE_FLAGTUNE: "0"
  SGLANG_PLUGINS: sglang_fl
  FLAGCX_PATH: /sgl-workspace/FlagCX
  SGLANG_FL_DIST_BACKEND: flagcx

bw1000: &bw1000_profile
  name: bw1000
  tests: &bw1000_tests
    unit:
      include: "*"
      # The Iluvatar import-shim contract asserts that unknown sgl_kernel/
      # flashinfer imports fail honestly. The HCU CI image instead installs
      # a meta-path stub finder that fabricates exactly those modules (HCU
      # ships no such wheels), so the honesty probes cannot hold on this
      # lane; the Iluvatar CI lane retains their full coverage.
      exclude:
        - platform/test_iluvatar_import_shims.py
    functional:
      include: "*"
      # Temporary runtime-migration unblockers. Keep the remaining functional
      # suite and all model-level E2E coverage active while the platform stack
      # owners investigate the isolated vendor-component failures:
      # - build-infra#1786: FlagTree JIT cannot discover the DTK device libs;
      # - build-infra#1787: paged varlen FlashAttention head_dim=256 numerics.
      # Remove both exclusions before final acceptance of the runtime image.
      exclude:
        - ops/test_hygon_mtp_logprobs.py
        - ops/test_hygon_mtp_attention.py
    e2e:
      # Diagnostic scope while build-infra#1786 is bypassed at job time: use
      # one representative eager model to reach the first post-JIT behavior
      # without spending scarce BW1000 runner time on equivalent failures.
      # Restore the full PR matrix before final acceptance.
      pr:
        inference:
          qwen3_6: [27b_tp2_hygon]
      nightly:
        inference: &hcu_model_cases
          qwen3_6: [27b_tp2_hygon, 35b_a3b_tp2_hygon]
        serving: *hcu_model_cases
        concurrent: *hcu_model_cases
        mtp: *hcu_model_cases
    # Benchmark and two-node TP2/PP2 acceptance are separate opt-in runs.
    benchmark:
      enabled: false
      smoke: []

bw1000_graph:
  <<: *bw1000_profile
  name: bw1000_graph
  tests:
    <<: *bw1000_tests
    # Explicitly retain the three standard graph tasks without inheriting MTP.
    e2e:
      # Temporarily covered by the eager diagnostic above; the complete graph
      # matrix remains available to nightly and must return to PR acceptance.
      pr: {}
      nightly:
        inference: *hcu_model_cases
        serving: *hcu_model_cases
        concurrent: *hcu_model_cases
