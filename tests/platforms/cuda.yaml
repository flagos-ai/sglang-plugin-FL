# CUDA-Based Platform Configuration
# Flexible test selection mechanism for NVIDIA GPU environments.
#
#
# Users can modify:
# - e2e: Add/remove model cases in inference and serving support lists
# - benchmark: Enable/disable throughput, latency, and serve smoke tests
# - unit: Add/remove paths in include and exclude lists
# - functional: Adjust include/exclude patterns for component (ops/compilation/distributed) tests
# - tolerance: Adjust numerical comparison tolerance for result validation
# - unsupported_features: Exclude test cases matching specific feature tags
# - env_defaults: Set CUDA/NCCL/SGLang environment defaults before tests start
#
# ---- Platform-level settings ------------------------------------------------
platform: cuda
vendor: nvidia

device_types:
  a100:
    compute_capability: "8.0"
    memory_gb: 80
    tags: [ampere, fp64, bf16]
  a800:
    compute_capability: "8.0"
    memory_gb: 80
    tags: [ampere, fp64, bf16, china-variant]
  h100:
    compute_capability: "9.0"
    memory_gb: 80
    tags: [hopper, fp8, bf16]

# Qwen3.6 is a hybrid attention model. Pin its full-attention path to the
# Triton backend used by the validated NVIDIA examples. The vision and linear
# attention backends remain independently selected by SGLang. Disable overlap
# scheduling for these correctness tests because A100 TP=4 concurrent decoding
# of the dense 27B model otherwise corrupts later tokens even though its
# single-request inference stays valid; use the same safe mode for both hybrids.
engine_overrides:
  qwen3_6:
    27b_tp4_nograph:
      attention_backend: "triton"
      disable_overlap_schedule: true
    35b_a3b_tp4_nograph:
      attention_backend: "triton"
      disable_overlap_schedule: true

# Default numerical tolerance for result comparison.
tolerance:
  inference:
    default: {exact: true}

# Device-level overrides for specific devices or categories.
device_overrides:
  h100:
    tolerance:
      inference:
        default: {rtol: 1e-4, atol: 1e-7}

# Features not supported on this platform.
# Test cases whose model name contains any of these strings will be skipped.
# Example: ["flaggems"] would skip "qwen3_flaggems" cases.
unsupported_features: []

# Default environment variables for this platform.
# tests/run.py applies these before invoking pytest.
env_defaults:
  CUDA_DEVICE_MAX_CONNECTIONS: "1"
  NCCL_ALGO: "Ring"
  USE_FLAGGEMS: "1"
  # FlagTree's cost-model mode needs the optional `flagtune` dependency set and
  # a remotely resolved model package. NVIDIA validation uses FlagGems' default
  # configs instead, matching the documented multi-node examples and keeping CI
  # independent of that optional service.
  USE_FLAGTUNE: "0"
  # Do not set SGLANG_FL_FLAGOS_BLACKLIST here. The versioned NVIDIA safety
  # defaults live in sglang_fl/dispatch/config/nvidia.yaml; an environment
  # override would replace that complete list instead of extending it.

# ---- Device-specific test configurations ------------------------------------
a100:
  name: "a100"
  tests:
    e2e:
      # Add or remove test cases per model.
      # Each case points to tests/models/<model>/<case>.yaml.
      concurrent:
        qwen3_6: ["35b_a3b_tp4_nograph", "27b_tp4_nograph"]
      inference:
        qwen3_6: ["35b_a3b_tp4_nograph",  "27b_tp4_nograph"]
      serving:
        qwen3: ["4b_tp2"]
        qwen3_6: ["35b_a3b_tp4_nograph", "27b_tp4_nograph"]

    # Functional tests (ops correctness, graph capture, collective ops).
    # Consumed by tests/run.py --scope functional; include/exclude work like unit.
    functional:
      include: "*"
      exclude: []

    unit:
      # Include patterns: "*" for all, or list specific paths.
      include: "*"
      # Exclude patterns: empty list or list paths to exclude.
      exclude: []

    benchmark:
      enabled: true
      smoke: ["throughput", "latency", "serve"]
