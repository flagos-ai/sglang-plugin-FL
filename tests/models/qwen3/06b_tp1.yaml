# Qwen3-0.6B model configuration (TP=2 not needed, single GPU)

llm:
  model: "/data/models/Qwen/Qwen3-0.6B"
  context_length: 8192
  mem_fraction_static: 0.7
  trust_remote_code: true

generate:
  # Prompts are fed as raw text (no chat template) to the Engine.generate path,
  # so they must be natural language-modeling continuations, not factual Q&A --
  # a 0.6B base completion of a question just continues the question. These were
  # verified on Qwen3-0.6B (MUSA) via raw completion.
  prompts:
    - text: "What is the capital of Germany?"
      expected: "Berlin"
    - text: "The capital of France is"
      expected: "Paris"
  sampling:
    max_new_tokens: 16
    temperature: 0.0
  parametrize:
  - disable_cuda_graph: true
    disable_piecewise_cuda_graph: true
    dtype: "bfloat16"