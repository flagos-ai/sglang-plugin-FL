[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sgl-kernel-shim"
version = "0.5.18"
description = "FlagOS zero-sgl-kernel import-face shim for sglang 0.5.18 (stub only, no native ops)"
requires-python = ">=3.10"

[tool.setuptools]
# Flat sgl_kernel (28 leaf modules) + sgl_kernel_npu (9 subpackages / 48
# leaf modules — generated by generate.py). Enumerate every package so the
# npu subpackages ship (setuptools does not auto-discover generated trees).
packages = [
    "sgl_kernel",
    "sgl_kernel_npu",
    "sgl_kernel_npu.activation",
    "sgl_kernel_npu.attention",
    "sgl_kernel_npu.fla",
    "sgl_kernel_npu.indexer",
    "sgl_kernel_npu.kimi_k3",
    "sgl_kernel_npu.mamba",
    "sgl_kernel_npu.mem_cache",
    "sgl_kernel_npu.norm",
    "sgl_kernel_npu.sample",
]
