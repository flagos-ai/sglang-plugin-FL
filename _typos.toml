[default.extend-words]
# Ascend CANN is Huawei's official toolkit name
CANN = "CANN"
cann = "cann"
# SGLang env var uses "INBALANCE" (upstream spelling)
INBALANCE = "INBALANCE"
lod = "lod"
# torch.arange / np.arange - real API names, not a typo of "arrange"
arange = "arange"
# "unparseable" is a valid variant (common in parsing/compiler docs)
unparseable = "unparseable"
# Qwen-VL grid shape identifier: temporal x height x width (image_grid_thw /
# video_grid_thw). Standard in Qwen2.5-VL / Qwen3-VL, not a typo of "the".
thw = "thw"
# MUSA / flashinfer C++ header file extension (.muh), e.g. flashinfer/sampling.muh
muh = "muh"

[files]
# Machine-generated runtime reference data for the NVIDIA CI image build
# (docker/cuda/runtime-0.5.18.containerfile). The site-files manifest lists
# 33k real runtime file paths (torch's nll_loss_nd, FlagGems' convolution_
# overrideable, ...) and the freeze/baseline quote package metadata; none
# of it is prose, so spellchecking them only produces false positives.
# The kunlunxin patched-sglang wheel below carries upstream identifiers
# verbatim; it is vendor payload, not prose.
extend-exclude = [
  "docker/cuda/runtime-0.5.18.site-files.sha256",
  "docker/cuda/runtime-0.5.18.runtime-freeze.txt",
  "docker/cuda/runtime-0.5.18.pip-check-baseline.txt",
  "docker/kunlunxin/sglang-v0.5.18-kunlunxin.patch",
]

[default.extend-identifiers]
# Recorded Hygon runtime commit; preserve the exact SHA in validation evidence.
"8029ba2" = "8029ba2"

[files]
extend-exclude = ["docker/kunlunxin/sglang-v0.5.18-kunlunxin.patch"]