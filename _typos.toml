[default.extend-words]
# Ascend CANN is Huawei's official toolkit name
CANN = "CANN"
cann = "cann"
# SGLang env var uses "INBALANCE" (upstream spelling)
INBALANCE = "INBALANCE"
lod = "lod"
# torch.arange / np.arange - real API names, not a typo of "arrange"
arange = "arange"
# "unparseable" is a valid variant (common in parsing/compiler docs)
unparseable = "unparseable"
# Qwen-VL grid shape identifier: temporal x height x width (image_grid_thw /
# video_grid_thw). Standard in Qwen2.5-VL / Qwen3-VL, not a typo of "the".
thw = "thw"
# MUSA / flashinfer C++ header file extension (.muh), e.g. flashinfer/sampling.muh
muh = "muh"
# MIS means multi-item scoring in SGLang (enable_mis / --enable-mis).
mis = "mis"
# DTK LLVM option on FlagTree's HCU compile path
# (-mllvm=-check-valu-data-forward-hazards=0), quoted verbatim in evidence.
valu = "valu"

[default.extend-identifiers]
# Recorded Hygon runtime commit; preserve the exact SHA in validation evidence.
"8029ba2" = "8029ba2"
# Recorded SHA256 of the HSACO the FlagTree HCU compile probe produces.
"ea37ba47" = "ea37ba47"

[files]
# Machine-generated validation evidence: real upstream file names recorded
# verbatim in the kunlunxin vendor patch, not our prose to fix. (The Hygon
# site-hash baseline moved out of the repo - it is collected dynamically
# from the build's resolved base digest by docker/hygon/scripts/verify_image.sh.)
extend-exclude = [
    "docker/kunlunxin/sglang-v0.5.18-kunlunxin.patch",
]
